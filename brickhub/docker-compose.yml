# Локальний запуск у Docker з PostgreSQL:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brickhub
      POSTGRES_USER: brickhub
      POSTGRES_PASSWORD: brickhub
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://brickhub:brickhub@db:5432/brickhub
      DJANGO_SECURE_SSL_REDIRECT: "0"
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on: [db]
volumes:
  pgdata:
  media:
