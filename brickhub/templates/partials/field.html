<div class="field{% if field.errors %} has-error{% endif %}{% if full %} full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span style="color:var(--red)">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
