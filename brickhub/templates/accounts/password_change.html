{% extends "accounts/_layout.html" %}
{% block acc_title %}Зміна пароля{% endblock %}
{% block acc_content %}
<form class="form-card" method="post">{% csrf_token %}
  <div class="fields" style="grid-template-columns:1fr;max-width:440px">{% for field in form %}{% include "partials/field.html" %}{% endfor %}</div>
  <button class="btn btn-dark" type="submit" style="margin-top:16px">Змінити пароль</button>
</form>
{% endblock %}
