{% extends "base.html" %}
{% block content %}
<div class="container auth-wrap"><div class="auth-card">
  <h1>Відновлення пароля</h1>
  <p class="muted">Вкажіть пошту акаунта — надішлемо посилання для створення нового пароля.</p>
  <form method="post">{% csrf_token %}
    <div class="fields">{% include "partials/field.html" with field=form.email %}</div>
    <button class="btn btn-lg btn-dark btn-block" type="submit" style="margin-top:16px">Надіслати посилання</button>
  </form>
</div></div>
{% endblock %}
