<!doctype html><html lang="uk"><body style="font-family:Arial,sans-serif;color:#111318">

<p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#d6101a;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:700">Створити новий пароль</a></p>
