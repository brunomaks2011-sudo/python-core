<!doctype html><html lang="uk"><body style="font-family:Arial,sans-serif;color:#111111">
<h2>Відновлення пароля</h2>
<p>Ви (або хтось інший) запросили відновлення пароля для {{ email }}.</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#111111;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700">Створити новий пароль</a></p>
<p style="color:#6e6e6e">Якщо ви не робили запиту — просто ігноруйте цей лист.</p>
</body></html>
