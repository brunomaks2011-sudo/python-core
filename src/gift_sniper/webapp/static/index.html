<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Снайпер MRKT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram passes the user's theme as --tg-theme-* variables; the fallbacks are a dark theme. */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #0e1013);
    --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #181b21));
    --text: var(--tg-theme-text-color, #f3f4f6);
    --hint: var(--tg-theme-hint-color, #8b919c);
    --accent: var(--tg-theme-button-color, #3d8bfd);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #5ea2ff);
    --danger: var(--tg-theme-destructive-text-color, #f05252);
    --ok: #2fbf71;
    --warn: #e9a91c;
    --mono: #a58bff;
    --fill: rgba(255, 255, 255, .07);
    --fill-2: rgba(255, 255, 255, .13);
    --line: rgba(255, 255, 255, .08);
    --art: rgba(255, 255, 255, .035);
    --art-hi: rgba(255, 255, 255, .11);
    --shadow: none;
    --tabbar-h: 60px;
  }
  :root[data-theme="light"] {
    --bg: var(--tg-theme-secondary-bg-color, #f1f2f5);
    --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111318);
    --hint: var(--tg-theme-hint-color, #707783);
    --mono: #7c5cf0;
    --fill: rgba(0, 0, 0, .05);
    --fill-2: rgba(0, 0, 0, .1);
    --line: rgba(0, 0, 0, .08);
    --art: rgba(0, 0, 0, .05);
    --art-hi: rgba(0, 0, 0, .015);
    --shadow: 0 1px 2px rgba(0, 0, 0, .06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 720px; min-height: 100vh; padding: 6px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body.has-savebar { padding-bottom: calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
  a { color: var(--link); text-decoration: none; }
  h2 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
  h3 { margin: 0; font-size: 17px; font-weight: 750; }
  .sub { color: var(--hint); font-size: 12.5px; }
  .grow { flex: 1; min-width: 0; }
  .hidden, [hidden] { display: none !important; }

  /* headers */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; margin: 0 0 6px; }
  .head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .pill { flex: none; border: 0; border-radius: 999px; padding: 6px 11px; background: var(--fill); color: var(--hint); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .pill.live { background: rgba(47, 191, 113, .16); color: var(--ok); }
  .pill.test { background: rgba(233, 169, 28, .16); color: var(--warn); }
  .pill.stop { background: rgba(240, 82, 82, .16); color: var(--danger); }
  .topbar { display: flex; align-items: center; min-height: 40px; margin: 0 0 6px -8px; }
  .back { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 8px; border: 0; background: none; color: var(--link); font-size: 16px; font-weight: 600; }
  .back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back svg { width: 20px; height: 20px; flex: none; }

  /* search and filters */
  .sticky { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding: 6px 16px 0; background: var(--bg); }
  .search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 4px 0 12px; border-radius: 12px; background: var(--fill); }
  .search > svg { width: 18px; height: 18px; flex: none; color: var(--hint); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; color: var(--text); font: inherit; -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--hint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .iconbtn { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border: 0; border-radius: 10px; background: none; color: var(--hint); }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn.on { color: var(--accent); }
  .chips { display: flex; gap: 6px; margin: 10px -16px; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border: 0; border-radius: 999px; background: var(--fill); font-size: 13.5px; font-weight: 650; }
  .chip i { margin-left: 4px; color: var(--hint); font-style: normal; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .chip.on i { color: inherit; opacity: .75; }

  /* picture tiles */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .grid > .empty { grid-column: 1 / -1; }
  .tile { position: relative; display: block; width: 100%; padding: 5px; border: 2px solid transparent; border-radius: 19px; background: var(--surface);
    text-align: left; box-shadow: var(--shadow); transition: transform .12s, border-color .15s; }
  .tile:active { transform: scale(.975); }
  .tile.on { border-color: var(--accent); }
  .art { position: relative; display: grid; place-items: center; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 14px;
    background: radial-gradient(circle at 50% 38%, var(--art-hi), var(--art) 72%); }
  .art img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; }
  .art .letter { position: absolute; color: var(--fill-2); font-size: 42px; font-weight: 800; }
  .cap { padding: 7px 5px 3px; }
  .name { overflow: hidden; font-size: 14.5px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .cap .sub { margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .split { display: flex; justify-content: space-between; gap: 6px; }
  .mono-t { color: var(--mono); font-weight: 700; }
  .tag { position: absolute; z-index: 2; top: 6px; padding: 3px 8px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11.5px; font-weight: 800; }
  .tag.tl { left: 6px; }
  .tag.tr { right: 6px; }
  .tag.buy, .tag.ok { background: var(--ok); }
  .lvl { position: absolute; z-index: 2; top: 6px; left: 6px; padding: 3px 8px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff;
    font-size: 11px; font-weight: 800; text-transform: capitalize; }
  .lvl.t-high { background: #7c3aed; }
  .lvl.t-medium { background: #2563eb; }
  .lvl.t-low { background: #0d9488; }
  .lvl.t-combo { background: #d97706; }
  .check { position: absolute; z-index: 2; top: 6px; right: 6px; width: 26px; height: 26px; border: 2px solid rgba(255, 255, 255, .9); border-radius: 50%;
    background: rgba(0, 0, 0, .28); transition: background .15s; }
  .tile.on .check { border-color: #fff; background: var(--accent); }
  .tile.on .check::after { content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }

  /* price inputs */
  .price { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 10px; border: 1.5px solid transparent; border-radius: 11px;
    background: var(--fill); cursor: text; transition: opacity .15s; }
  .price input { flex: 1; width: 100%; min-width: 0; padding: 0; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-weight: 700; text-align: right; }
  .price input::placeholder { color: var(--hint); font-weight: 500; }
  .price span { color: var(--hint); font-size: 12px; font-weight: 700; }
  .price:focus-within { border-color: var(--accent); opacity: 1 !important; }
  .price.bad { border-color: var(--danger); animation: shake .3s; }
  .price.sm { height: 34px; margin-top: 7px; }
  .off .price, .tile.pair:not(.on) .price { opacity: .5; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* collection and model header */
  .hero { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; }
  .hero > .art, .hero > .skel { width: 96px; height: 96px; flex: none; border-radius: 22px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .fact { padding: 4px 8px; border-radius: 8px; background: var(--fill); font-size: 12px; font-weight: 650; }
  .fact.mono { background: rgba(165, 139, 255, .16); color: var(--mono); }

  /* controls */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 13px; background: var(--fill); }
  .seg button { padding: 10px 6px; border: 0; border-radius: 10px; background: none; color: var(--hint); font-size: 14px; font-weight: 700; }
  .seg button.on { background: var(--accent); color: var(--accent-text); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
  .seg button.locked { opacity: .4; }
  .seg.seg3 { grid-template-columns: repeat(3, 1fr); }
  .seg.seg3 button { padding: 10px 2px; font-size: 13px; }
  .seg button small { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; opacity: .75; }
  .floor-note { display: none; color: var(--mono); font-size: 12.5px; font-weight: 700; }
  .floorpriced .range, .grid.floorpriced .range { display: none; }
  .opt.floorpriced .floor-note { display: block; flex: none; white-space: nowrap; }
  .grid.floorpriced .floor-note { display: block; min-height: 34px; margin-top: 7px; padding: 8px 2px 0; }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; width: 0; height: 0; opacity: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--fill-2); transition: background .2s; }
  .switch span::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .switch input:disabled + span { opacity: .5; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 700; }
  .btn.small { width: auto; height: 40px; padding: 0 16px; font-size: 14px; }
  .btn.soft { background: var(--fill); color: var(--text); }
  .btn.danger { background: rgba(240, 82, 82, .12); color: var(--danger); }
  .btn:disabled { opacity: .55; }
  .link { padding: 4px 0; border: 0; background: none; color: var(--link); font-weight: 650; }

  /* cards and lists */
  .card { margin-bottom: 12px; padding: 2px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .line { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line b { font-weight: 650; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt > .line { padding-bottom: 8px; }
  .range { display: flex; align-items: center; gap: 6px; }
  .range .price { flex: 1; min-width: 0; }
  .range .dash { color: var(--hint); }
  .opt .range { padding: 0 0 12px 63px; }
  .tile .range { margin-top: 7px; }
  .tile .range .price.sm { margin-top: 0; padding: 0 8px; }
  .rowbtn { display: flex; align-items: center; gap: 12px; width: 100%; margin: 12px 0; padding: 13px 14px; border: 0; border-radius: 16px;
    background: var(--surface); text-align: left; box-shadow: var(--shadow); }
  .chev { color: var(--hint); font-size: 24px; line-height: 1; }
  .label { margin: 20px 4px 8px; color: var(--hint); font-size: 13px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .sect { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 20px 2px 10px; }
  .sect h3 i { margin-left: 5px; color: var(--hint); font-style: normal; font-weight: 600; }
  .hint { margin: 8px 4px 12px; color: var(--hint); font-size: 12.5px; }
  .bulk { display: flex; gap: 8px; margin: 0 0 12px; }
  .bulk .price { flex: 1; }
  .banner { display: flex; align-items: center; gap: 10px; width: 100%; margin: 4px 0 12px; padding: 11px 13px; border: 0; border-radius: 14px;
    background: rgba(233, 169, 28, .14); text-align: left; font-size: 14px; }
  .banner .chev { font-size: 20px; }
  .mode { margin-bottom: 12px; padding: 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .mode b { display: block; margin-bottom: 3px; font-size: 16px; }
  .mode.live { background: rgba(47, 191, 113, .13); }
  .mode.dry_run { background: rgba(233, 169, 28, .13); }
  .mode.stop { background: rgba(240, 82, 82, .13); }
  .ck { display: flex; align-items: center; gap: 10px; padding: 11px 0; font-size: 14px; }
  .ck + .ck { border-top: 1px solid var(--line); }
  .ck .mark { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--warn); color: #fff; font-size: 12px; font-weight: 800; }
  .ck.ok .mark { background: var(--ok); }
  .ck.ok .grow { color: var(--hint); }
  .rcard { margin-bottom: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .rcard.paused .rhead, .rcard.paused .picks { opacity: .55; }
  .rhead { display: flex; align-items: center; gap: 12px; }
  .rhead b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { position: relative; display: grid; place-items: center; width: 48px; height: 48px; flex: none; overflow: hidden; border-radius: 12px; background: var(--fill); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .thumb .letter { color: var(--hint); font-weight: 800; }
  .picks { margin-top: 10px; }
  .pk { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .pk .pr { color: var(--hint); font-weight: 700; white-space: nowrap; }
  .ractions { display: flex; gap: 6px; margin-top: 10px; }
  .pbtn { flex: 1; padding: 10px 6px; border: 0; border-radius: 10px; background: var(--fill); font-size: 13px; font-weight: 650; }
  .pbtn.danger { color: var(--danger); }
  .total { margin: 0 4px 12px; color: var(--hint); font-size: 14px; }
  .total b { color: var(--text); }
  .day { margin: 16px 4px 8px; color: var(--hint); font-size: 13px; font-weight: 650; }
  .hrow { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 10px 12px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .hrow .right { flex: none; text-align: right; }
  .st { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--hint); font-size: 11.5px; font-weight: 700; }
  .st.confirmed { background: rgba(47, 191, 113, .16); color: var(--ok); }
  .st.dry_run { background: rgba(233, 169, 28, .16); color: var(--warn); }
  .st.failed, .st.cancelled { background: rgba(240, 82, 82, .14); color: var(--danger); }
  .empty { padding: 36px 16px; color: var(--hint); text-align: center; }
  .empty .big { margin-bottom: 8px; font-size: 44px; }
  .empty b { display: block; margin-bottom: 4px; color: var(--text); font-size: 16px; }
  .empty .btn { display: inline-flex; width: auto; margin-top: 16px; }
  .foot { margin: 20px 4px; color: var(--hint); font-size: 12.5px; text-align: center; }

  /* loading placeholders */
  .skel { border-radius: 18px; background: linear-gradient(100deg, var(--surface) 30%, var(--fill-2) 50%, var(--surface) 70%);
    background-size: 300% 100%; animation: sk 1.3s linear infinite; }
  .skel.stile { aspect-ratio: .8; }
  .skel.srow { height: 76px; margin-bottom: 10px; }
  .skel.sline { height: 16px; border-radius: 8px; }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* bottom navigation, save bar, sheet, toast */
  .tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); max-width: 720px; margin: 0 auto;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
  .tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 0; border: 0; background: none;
    color: var(--hint); font-size: 11px; font-weight: 650; }
  .tabbar button.on { color: var(--accent); }
  .tabbar svg { width: 25px; height: 25px; }
  .tabbar .count { position: absolute; top: -2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: var(--accent-text); font-size: 10.5px; font-weight: 800; line-height: 18px; text-align: center; }
  .tabbar .dot { position: absolute; top: 1px; left: calc(50% + 7px); width: 11px; height: 11px; border: 2px solid var(--surface); border-radius: 50%; background: var(--warn); }
  .savebar { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto;
    padding: 10px 16px 8px; background: linear-gradient(transparent, var(--bg) 30%); }
  body.typing .tabbar, body.typing .savebar { display: none; }
  .sheet-bg { position: fixed; z-index: 40; inset: 0; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-width: 720px; max-height: 86vh; margin: 0 auto; padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
    overflow-y: auto; border-radius: 22px 22px 0 0; background: var(--bg); transform: translateY(105%); visibility: hidden;
    transition: transform .25s cubic-bezier(.2, .8, .2, 1), visibility 0s .25s; }
  .sheet.open { transform: none; visibility: visible; transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .grab { width: 38px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: var(--fill-2); }
  .sheet h3 { margin: 0 2px 2px; font-size: 19px; }
  .opt-line { display: flex; align-items: center; width: 100%; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: 15px; }
  .opt-line .tick { margin-left: auto; color: var(--accent); font-weight: 800; }
  .toast { position: fixed; z-index: 50; left: 50%; bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom)); max-width: 88vw; padding: 10px 16px;
    border-radius: 12px; background: rgba(20, 20, 24, .94); color: #fff; font-size: 14px; text-align: center; opacity: 0; pointer-events: none;
    transform: translate(-50%, 10px); transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main id="view"></main>
<div class="savebar" id="savebar" hidden><button class="btn" id="savebtn">Сохранить</button></div>
<nav class="tabbar" id="tabbar">
  <button data-tab="collections" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Коллекции</button>
  <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" stroke-linecap="round"/></svg>Берёт бот<i class="count" id="tab-count" hidden></i></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>Настройки<i class="dot" id="tab-dot" hidden></i></button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>
</nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const view = document.getElementById("view");
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const S = {
  me: null, collections: null, loading: null,
  tab: "collections", page: "list",                       // collections tab: list → collection → model
  list: { q: "", filter: "all", sort: "taken", scroll: 0 },

const Save = {

  if (d.any.on && reversed(d.any)) return markBad(field('[data-opt="any"] [data-min]'), "«От» больше «до» у «Любой фон»");

    if (d.mono.on && !d.mono.price.trim()) return markBad(field('[data-opt="mono"] [data-max]'), "Укажите цену «до» для «Все монохромы»");
    if (d.mono.on && reversed(d.mono)) return markBad(field('[data-opt="mono"] [data-min]'), "«От» больше «до» у «Все монохромы»");
    const missing = d.pairs.findIndex((p) => p.on && !p.price.trim());
    if (missing >= 0) return markBad(field(`[data-price="${missing}"]`), `Укажите цену «до» для фона ${m.pairs[missing].backdrop}`);
    const upside = d.pairs.findIndex((p) => p.on && reversed(p));
    if (upside >= 0) return markBad(field(`[data-pmin="${upside}"]`), `«От» больше «до» у фона ${m.pairs[upside].backdrop}`);
  }
  Save.busy(true);
  try {
    S.col = await api(`/collections/${encodeURIComponent(c.name)}/picks`, "PUT", {
      model: m.name, autobuy: c.autobuy,
      any_price_ton: d.any.on ? d.any.price.trim() : null,
      any_min_ton: d.any.on ? d.any.min.trim() || null : null,
      monochrome_price_ton: d.mono.on && !floor ? d.mono.price.trim() : null,
      monochrome_min_ton: d.mono.on && !floor ? d.mono.min.trim() || null : null,
      monochrome_rule: d.mono.on && floor ? floor : null,
      pairs: m.pairs.map((p, i) => [p, d.pairs[i]]).filter(([, o]) => o.on).map(([p, o]) => (floor
        ? { backdrop: p.backdrop, rule: floor }
        : { backdrop: p.backdrop, price_ton: o.price.trim(), min_ton: o.min.trim() || null })),
    });
    S.draft = null; Save.hide(); haptic("success"); toast("Сохранено"); changed(true);
    if (S.tab === "collections" && S.page === "model") { const y = window.scrollY; drawModel(); window.scrollTo(0, y); }
  } catch (err) { toast(err.message); haptic("error"); }
  finally { Save.busy(false); }
}

// ------------------------------------------------------------------ what the bot takes
function groupRules(items) {
  const groups = new Map(), other = [], everywhere = [];
  for (const r of items) {
    if (r.plan && !r.collection) { everywhere.push(r); continue; }  // "all monochromes up to a floor"
    if (!r.plan || !r.collection) { other.push(r); continue; }
    const key = r.collection.toLowerCase();
    if (!groups.has(key)) groups.set(key, { collection: r.collection, image: r.image, rules: [], picks: [] });
    const g = groups.get(key);
    g.rules.push(r);
    for (const p of r.pick_items) g.picks.push({ ...p, mono: r.kind === "monochrome" });
  }
  const title = (name) => (S.collections || []).find((c) => c.name === name)?.title || name;
  const list = [...groups.values()].map((g) => ({
    ...g, title: title(g.collection), ids: g.rules.map((r) => r.id).join(","),
    enabled: g.rules.some((r) => r.enabled), autobuy: g.rules.some((r) => r.autobuy),
    picks: g.picks.sort((a, b) => (a.model || "").localeCompare(b.model || "", "ru") || b.backdrops.length - a.backdrops.length),
  }));
  return { groups: list.sort(byTitle), other, everywhere };
}
function pickLine(p) {
  const what = p.backdrops.length ? `⚫ ${p.backdrops.join(", ")}` : p.mono ? "⚫ все монохромы" : "любой фон";
  const top = RULE_UPTO[p.rule] || `до ${ton(p.price)}`;
  const limit = p.min != null ? `от ${ton(p.min)} ${top}` : top;
  return `<div class="pk"><span><b>${esc(p.model || "Вся коллекция")}</b> · ${esc(what)}</span><span class="pr">${esc(limit)}</span></div>`;
}
const stateText = (r) => (!r.enabled ? "⏸ выключено" : r.autobuy ? "🛒 покупает сам" : "🔔 присылает листинги");
function ruleActions(r, edit) {

function everywhereCard(r) {

  };
  const g = m.giftwiki;
  const age = g.age_hours == null ? "" : g.age_hours < 1 ? " · обновлены меньше часа назад" : ` · обновлены ${Math.round(g.age_hours)} ч назад`;
  $("#datainfo").textContent = g.records ? `Монохромных пар в базе: ${num(g.records, 0)}${age}` : "Данные о монохромах ещё не загружены";
}
async function saveLimits() {
  const body = {};
  $$("[data-limit]").forEach((input) => (body[input.dataset.limit] = input.value.trim() || null));
  Save.busy(true);
  try {
    S.me = await api("/settings", "PUT", body);
    Save.hide(); haptic("success"); toast("Лимиты сохранены"); updateChrome();
    if (S.tab === "settings") renderSettings();
  } catch (err) { toast(err.message); haptic("error"); }
  finally { Save.busy(false); }
}

// ------------------------------------------------------------------ history
function dayLabel(d) {
  const today = new Date(), yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "Сегодня";
  if (d.toDateString() === yesterday.toDateString()) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}
async function renderHistory() {
  const id = newScreen();
  view.innerHTML = head("История") + skeletonRows(4);
  let items;
  try { items = (await api("/history")).items; } catch (err) { if (!stale(id)) fail(err, renderHistory); return; }
  if (stale(id)) return;
  items.sort((a, b) => b.created_at.localeCompare(a.created_at));
  let day = "";
  view.innerHTML = head("История") + (items.length ? items.map((a) => {
    const d = new Date(a.created_at), label = dayLabel(d);
    const sep = label !== day ? `<div class="day">${label}</div>` : "";
    day = label;
    return sep + `<div class="hrow"${a.url ? ` data-url="${esc(a.url)}"` : ""}>
      ${thumb(a.image, a.title)}
      <div class="grow"><div class="name">${esc(a.title)}</div>
        <div class="sub">${esc([a.model, a.backdrop].filter(Boolean).join(" · "))}</div>
        <div class="sub">${d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}${a.rule ? " · " + esc(a.rule.replace(/^📱\s*/u, "")) : ""}</div></div>
      <div class="right"><b>${ton(a.price)}</b><br><span class="st ${esc(a.status)}">${esc(a.status_label)}</span></div></div>`;
  }).join("") : empty("🧾", "Покупок пока не было", "Здесь появятся покупки и тестовые «был бы куплен»."));
  $$("[data-url]").forEach((el) => (el.onclick = () => openLink(el.dataset.url)));
}

// ------------------------------------------------------------------ start
function applyTheme() {
  document.documentElement.dataset.theme = tg && tg.colorScheme === "light" ? "light" : "dark";
  if (!tg || !tg.isVersionAtLeast) return;
  try {
    if (tg.isVersionAtLeast("6.1")) { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); }
    if (tg.isVersionAtLeast("7.10") && tg.setBottomBarColor) tg.setBottomBarColor("secondary_bg_color");
  } catch (e) { /* old clients */ }
}
// on phones the keyboard would push the bottom bar over the field being typed in
if (tg && ["android", "ios"].includes(tg.platform)) {
  document.addEventListener("focusin", (e) => { if (e.target.matches("input:not([type=checkbox])")) document.body.classList.add("typing"); });
  document.addEventListener("focusout", () => setTimeout(() => {
    if (!document.activeElement || !document.activeElement.matches("input:not([type=checkbox])")) document.body.classList.remove("typing");
  }, 60));
}
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input")) e.target.blur(); });
(async () => {
  applyTheme();
  if (!tg || !tg.initData) {
    $("#tabbar").hidden = true;
    view.innerHTML = empty("📱", "Откройте приложение из Telegram", "Кнопка «Снайпер» в чате с ботом или команда /app.");
    return;
  }
  tg.ready(); tg.expand();
  if (tg.onEvent) tg.onEvent("themeChanged", applyTheme);
  try { await loadMe(); } catch (err) { return fail(err, () => location.reload()); }
  render();
})();
</script>
