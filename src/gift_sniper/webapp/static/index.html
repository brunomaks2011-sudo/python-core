<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Снайпер MRKT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* A black theme with dark grey cards and purple for what is active or chosen. */
  :root {
    --bg: #000;
    --card: #111;
    --card-line: #1b1b1b;
    --well: #0b0b0b;
    --field: #1f1f1f;
    --field-line: #282828;
    --dd: #292929;
    --tile: #1f1f1f;
    --text: #fff;
    --text-2: #d4d4d6;
    --hint: #8a8a8e;
    --hint-2: #626266;
    --line: #1d1d1d;
    --accent: #5534f3;
    --accent-soft: rgba(85, 52, 243, .17);
    --link: #7b66ff;
    --ok: #32d74b;
    --warn: #ffb340;
    --danger: #ff453a;
    --mono: #b7a6ff;
    --nav: #0d0d0d;
    --nav-h: 68px;
    --safe-b: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-x: hidden; }
  body { margin: 0 auto; max-width: 720px; min-height: 100vh; padding: 10px 16px calc(var(--nav-h) + var(--safe-b) + 28px); overflow-x: hidden;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  body.has-savebar { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 100px); }
  button { margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
  input { font: inherit; }
  a { color: var(--link); text-decoration: none; }
  svg { display: block; }
  h2 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
  h3 { margin: 0; font-size: 18px; font-weight: 750; }
  .sub { color: var(--hint); font-size: 12.5px; }
  .grow { flex: 1; min-width: 0; }
  .hidden, [hidden] { display: none !important; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* headers */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; margin: 2px 0 14px; }
  .head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .pill { flex: none; border-radius: 999px; padding: 7px 12px; background: var(--field); color: var(--hint); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .pill.live { background: rgba(50, 215, 75, .14); color: var(--ok); }
  .pill.test { background: rgba(255, 179, 64, .14); color: var(--warn); }
  .pill.stop { background: rgba(255, 69, 58, .14); color: var(--danger); }
  .subhead { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 12px; margin: 4px 0 16px; }
  .subhead b { display: block; overflow: hidden; font-size: 19px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
  .subhead .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .label { margin: 22px 2px 10px; color: #808084; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

  /* square buttons and the collection switcher */
  .sqbtn { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border: 1px solid #383838; border-radius: 11px; background: #2c2c2c; color: #fff; }
  .sqbtn svg { width: 22px; height: 22px; }
  .sqbtn.dark { border-color: #262626; background: var(--field); }
  .sqbtn:active, .colbtn:active, .dd:active, .wbtn:active, .dbtn:active, .mcard:active, .bcard:active, .scard:active { transform: scale(.97); }
  .sw { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 9px; margin-top: 4px; }
  .colbtn { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #2a2a2a; border-radius: 11px; background: #212121; }
  .colbtn .ci { position: relative; display: grid; place-items: center; width: 28px; height: 28px; flex: none; overflow: hidden; border-radius: 8px; color: var(--hint); font-weight: 800; }
  .colbtn .ci img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .colbtn .ct { overflow: hidden; font-size: 17px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }

  /* text fields */
  .field { display: block; width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--card-line); border-radius: 11px; outline: none; background: var(--card); color: var(--text);
    font-size: 16px; -webkit-appearance: none; appearance: none; }
  .field::placeholder { color: var(--hint-2); }
  .field:focus { border-color: var(--accent); }
  .field.bad { border-color: var(--danger); animation: shake .3s; }
  .search { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 12px; border: 1px solid var(--field-line); border-radius: 11px; background: var(--field); }
  .search > svg { width: 20px; height: 20px; flex: none; color: var(--hint); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; color: var(--text); font-size: 16px; -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--hint-2); }
  .search input::-webkit-search-cancel-button { display: none; }

  /* filters: three dropdowns, actions */
  .dds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
  .dd { display: flex; align-items: center; justify-content: space-between; gap: 2px; min-width: 0; height: 40px; padding: 0 6px 0 10px; border: 1.5px solid transparent;
    border-radius: 11px; background: var(--dd); font-size: min(15.5px, 3.6vw); }
  .dd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd svg { width: 14px; height: 14px; flex: none; color: #c7c7cc; transition: transform .2s; }
  .dd.on { border-color: var(--accent); }
  .dd.on svg { transform: rotate(180deg); }
  .dd.set span { font-weight: 650; }
  .acts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr) 40px; gap: 9px; margin-top: 10px; }
  .wbtn, .dbtn { height: 40px; padding: 0 6px; overflow: hidden; border-radius: 11px; font-size: min(16px, 3.75vw); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .wbtn { background: #fff; color: #000; }
  .dbtn { border: 1px solid #262626; background: var(--field); color: #fff; }
  .wbtn:disabled, .dbtn:disabled { opacity: .6; }

  /* pickers: models by rarity, backdrops by colour, patterns */
  .panel { margin-top: 10px; padding: 14px 12px; border: 1px solid #1a1a1a; border-radius: 18px; background: var(--card); }
  .ghead { display: flex; align-items: center; gap: 14px; margin: 16px 2px 10px; }
  .gl { color: var(--hint); font-size: 13.5px; white-space: nowrap; }
  .gl b { color: var(--text); font-weight: 700; }
  .glink { color: var(--link); font-size: 16px; font-weight: 600; white-space: nowrap; }
  .fold { display: grid; place-items: center; width: 30px; height: 30px; margin-left: auto; color: #fff; }
  .fold svg { width: 20px; height: 20px; transition: transform .2s; }
  .group.shut .fold svg { transform: rotate(180deg); }
  .group.shut .mgrid { display: none; }
  .mgrid, .bgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  @media (max-width: 359px) { .mgrid, .bgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .mcard, .bcard, .scard { display: flex; flex-direction: column; align-items: center; min-width: 0; border: 1.5px solid #282828; border-radius: 11px; background: var(--tile); }
  .mcard { gap: 3px; padding: 9px 3px 8px; }
  .bcard, .scard { gap: 5px; padding: 9px 3px 8px; border-color: #262626; background: #1a1a1a; }
  .mcard.on, .bcard.on, .scard.on { border-color: var(--accent); background: #1c1830; }
  .mimg { position: relative; display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 4px; }
  .mimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 9px; }
  .mimg .letter { color: #4a4a4e; font-size: 20px; font-weight: 800; }
  .mname, .bname { width: 100%; overflow: hidden; font-size: 12.5px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
  .mname { color: #d6d6d8; }
  .bname { font-weight: 600; }
  .btype { max-width: 100%; margin-top: -3px; overflow: hidden; color: #77777b; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .tonv { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tonv svg { width: 12px; height: 12px; }
  .sortrow { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
  .sortrow { min-width: 0; }
  .sortpill { display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 min(12px, 2.8vw); border-radius: 11px; color: #8e8e93;
    font-size: min(16px, 4vw); font-weight: 600; white-space: nowrap; }
  .sortpill svg { width: 15px; height: 15px; transition: transform .2s; }
  .sortpill.on { background: var(--field); color: #fff; }
  .sortpill.on.desc svg { transform: rotate(180deg); }
  .sortpill.solid { margin-left: auto; background: var(--field); color: #fff; }
  .secthead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 16px 2px 10px; color: var(--hint); font-size: 13.5px; }
  .secthead i { color: #6c6c70; font-style: normal; font-size: 12.5px; }
  .swatch { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 8px; background: #2a2a2a; font-size: 14px; }
  .swatch.mono { background: #2a2540; }
  .divider { height: 1px; margin: 14px 0; background: var(--line); }
  .sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .scard { padding: 10px 6px; }
  .pempty { padding: 22px 8px 6px; color: var(--hint); font-size: 14px; text-align: center; }

  /* what is chosen */
  .selcard { padding: 14px; border: 1px solid #1a1a1a; border-radius: 18px; background: var(--card); }
  .selhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .schips + .selhead { margin-top: 14px; }
  .selhead b { font-size: 16px; font-weight: 600; }
  .selhead .glink { font-size: 15.5px; }
  .schips { display: flex; gap: 10px; margin: 12px -14px 0; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
  .schips::-webkit-scrollbar { display: none; }
  .schip { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 62px; flex: none; }
  .schip .mimg { width: 44px; height: 44px; margin: 0; }
  .schip .swatch { width: 44px; height: 44px; border-radius: 11px; font-size: 18px; }
  .schip .nm { max-width: 62px; overflow: hidden; color: #cfcfd2; font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }

  /* prices */
  .pbox { margin-top: 10px; padding: 9px; border: 1px solid #1a1a1a; border-radius: 16px; background: var(--card); }
  .pcells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(calc((100% - 16px) / 3), 1fr); gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .pcells::-webkit-scrollbar { display: none; }
  .pcell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; min-width: 0; min-height: 66px; padding: 10px 6px; border-radius: 11px; background: var(--well); }
  .pt { display: flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; font-size: 13.5px; font-weight: 500; }
  .pt > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pt .pic { position: relative; display: grid; place-items: center; width: 20px; height: 20px; flex: none; overflow: hidden; border-radius: 50%; background: #1d1d1d; color: var(--hint); font-size: 11px; }
  .pt .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pt .swatch { width: 20px; height: 20px; border-radius: 50%; }
  .pv { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13.5px; white-space: nowrap; }
  .pv span { display: inline-flex; align-items: center; gap: 4px; }
  .pv svg { width: 15px; height: 15px; }
  .pv .ton svg { color: #4f9dff; }
  .pv .ls { color: var(--hint); }
  .pnote { margin: 9px 4px 1px; color: #6c6c70; font-size: 12px; line-height: 1.5; }
  .pnote svg { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; }

  /* subscription form */
  .subcard { padding: 14px; border: 1px solid #1c1c1c; border-radius: 20px; background: var(--card); }
  .subcard > .field { border-color: var(--field-line); background: var(--field); }
  .what { margin: 8px 2px 0; color: var(--hint); font-size: 13px; line-height: 1.4; }
  .trow { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 13px 14px; border-radius: 14px; background: var(--well); cursor: pointer; }
  .trow .ttl { font-size: min(17px, 4.1vw); font-weight: 500; }
  .trow .tsub { margin-top: 4px; color: #6e6e72; font-size: 12.5px; }
  .trow.prow { padding: 9px 9px 9px 14px; cursor: default; }
  .trow.prow .range { flex: 1; }
  .fhint { margin: 10px 4px 0; color: var(--warn); font-size: 13px; }
  .fhint:empty { display: none; }

  /* buttons and switches */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; padding: 0 16px; border-radius: 12px; background: var(--accent);
    color: #fff; font-size: 17px; font-weight: 700; }
  .subcard > .btn { margin-top: 12px; }
  .btn.ghost { height: 44px; margin-top: 6px; background: none; color: var(--hint); font-size: 15px; font-weight: 600; }
  .btn.soft { background: var(--field); font-size: 15px; }
  .btn.danger { background: rgba(255, 69, 58, .12); color: var(--danger); font-size: 15px; }
  .btn.small { width: auto; height: 40px; font-size: 14px; }
  .btn:disabled { opacity: .55; }
  .link { padding: 4px 0; color: var(--link); font-weight: 650; }
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; width: 0; height: 0; opacity: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #3a3a3c; transition: background .2s; }
  .switch span::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: transform .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .switch input:disabled + span { opacity: .45; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid #1a1a1a; border-radius: 13px; background: var(--card); }
  .seg button { padding: 10px 6px; border-radius: 10px; color: var(--hint); font-size: 14px; font-weight: 700; }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button.locked { opacity: .4; }
  .seg.seg3 { grid-template-columns: repeat(3, 1fr); }
  .seg.seg3 button { padding: 10px 2px; font-size: 13px; }
  .seg button small { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; opacity: .75; }

  /* price inputs */
  .price { display: flex; align-items: center; gap: 4px; min-width: 0; height: 40px; padding: 0 10px; border: 1.5px solid transparent; border-radius: 10px;
    background: var(--field); cursor: text; transition: opacity .15s; }
  .price input { flex: 1; width: 100%; min-width: 0; padding: 0; border: 0; outline: none; background: none; color: var(--text); font-size: 16px; font-weight: 650; text-align: right; }
  .price input::placeholder { color: var(--hint-2); font-weight: 500; }
  .price span { color: var(--hint); font-size: 12px; font-weight: 700; }
  .price:focus-within { border-color: var(--accent); opacity: 1 !important; }
  .price.bad { border-color: var(--danger); animation: shake .3s; }
  .price.sm { height: 34px; margin-top: 7px; padding: 0 8px; }
  .off .price, .tile.pair:not(.on) .price { opacity: .5; }
  .range { display: flex; align-items: center; gap: 6px; }
  .range .price { flex: 1; }
  .range .dash { color: var(--hint); }

  /* cards and lists */
  .card { margin-bottom: 12px; padding: 2px 14px; border: 1px solid #1a1a1a; border-radius: 18px; background: var(--card); }
  .line { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line b { font-weight: 600; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt > .line { padding-bottom: 8px; }
  .opt .range { padding: 0 0 12px 63px; }
  .rowbtn { display: flex; align-items: center; gap: 12px; width: 100%; margin: 12px 0; padding: 14px; border: 1px solid #1a1a1a; border-radius: 18px; background: var(--card); text-align: left; }
  .chev { color: var(--hint); font-size: 24px; line-height: 1; }
  .hint { margin: 8px 4px 12px; color: var(--hint); font-size: 12.5px; }
  .banner { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 12px; padding: 12px 14px; border: 1px solid rgba(255, 179, 64, .25); border-radius: 16px;
    background: rgba(255, 179, 64, .1); text-align: left; font-size: 14px; }
  .banner .chev { font-size: 20px; }
  .mode { margin: 12px 0; padding: 14px; border: 1px solid #1a1a1a; border-radius: 18px; background: var(--card); }
  .mode b { display: block; margin-bottom: 3px; font-size: 16px; }
  .mode.live { border-color: rgba(50, 215, 75, .3); background: rgba(50, 215, 75, .08); }
  .mode.dry_run { border-color: rgba(255, 179, 64, .3); background: rgba(255, 179, 64, .08); }
  .mode.stop { border-color: rgba(255, 69, 58, .3); background: rgba(255, 69, 58, .08); }
  .lrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid #191919; border-radius: 16px; background: var(--card); text-align: left; }
  .lrow + .lrow { margin-top: 8px; }
  .lrow:active { background: #161616; }
  .lt { overflow: hidden; font-size: 15px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lr { flex: none; text-align: right; }
  .lr b { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; }
  .lr b svg { width: 14px; height: 14px; }
  .lr .sub { margin-top: 2px; }
  .gimg { position: relative; display: grid; place-items: center; width: 50px; height: 50px; flex: none; overflow: hidden; border-radius: 12px; background: var(--field); }
  .gimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gimg .letter, .thumb .letter { color: #4a4a4e; font-weight: 800; }
  .mono-badge { display: inline-block; margin-right: 2px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--mono); font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .rank { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--field); color: var(--hint); font-size: 13px; font-weight: 800; }
  .rank.r1 { background: #f5c542; color: #000; }
  .rank.r2 { background: #c9ced6; color: #000; }
  .rank.r3 { background: #d08b4f; color: #000; }
  .thumb { position: relative; display: grid; place-items: center; width: 44px; height: 44px; flex: none; overflow: hidden; border-radius: 12px; background: var(--field); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .rcard { margin-bottom: 12px; padding: 14px; border: 1px solid #1a1a1a; border-radius: 18px; background: var(--card); }
  .rcard.paused .rhead, .rcard.paused .picks, .rcard.paused .tpills { opacity: .5; }
  .rcard.flash { animation: flash 1.8s ease-out; }
  @keyframes flash { 0%, 45% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } 100% { border-color: #1a1a1a; box-shadow: none; } }
  .rhead { display: flex; align-items: center; gap: 12px; }
  .rhead b { display: block; overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
  .rhead .sub { margin-top: 2px; }
  .picks { margin-top: 10px; }
  .pk { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .pk .pr { color: var(--hint); font-weight: 700; white-space: nowrap; }
  .tpills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tpill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1.5px solid #2a2a2a; border-radius: 10px; background: #161616;
    color: var(--hint); font-size: 13.5px; font-weight: 650; }
  .tpill i { width: 8px; height: 8px; border-radius: 50%; background: #48484c; }
  .tpill.on { border-color: var(--accent); background: var(--accent-soft); color: #fff; }
  .tpill.on i { background: #9d8bff; }
  .ractions { display: flex; gap: 6px; margin-top: 12px; }

function hsl(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}

  if (q.bsort === "name") return [...list].sort((a, b) => dir * byName(a, b));
  const key = (b) => {
    if (!COLOR.test(b.center || "")) return [2, 0];
    const [h, s, l] = hsl(b.center);
    return s < 0.15 || l < 0.12 ? [0, l] : [1, h];
  };
  return [...list].sort((a, b) => {
    const x = key(a), y = key(b);
    if (x[0] === 2 || y[0] === 2) return x[0] - y[0] || byName(a, b);
    return dir * (x[0] - y[0] || x[1] - y[1]) || byName(a, b);
  });
}

    ${n ? `<div class="label">Цена монохромов</div>${ruleSwitch("ruleseg", d.rule)}<p class="hint" id="rulehint"></p>

function pairTile(c, m, p, i) {

      <div class="floor-note"></div></div></div>`;

function bindModel(m) {
  const d = S.draft;
  const tick = (p, i) => {  // with an own price, a newly ticked backdrop starts from a suggested range
    if (!p.on || d.rule !== "fixed") return;
    if (!p.price.trim()) $(`[data-price="${i}"]`).value = p.price = suggestedPrice(m);
    if (!p.min.trim()) $(`[data-pmin="${i}"]`).value = p.min = suggestedMin();
  };
  bindOptions(view, d, refreshModel);
  $$("#ruleseg [data-rule]").forEach((b) => (b.onclick = () => { d.rule = b.dataset.rule; haptic(); d.pairs.forEach(tick); refreshModel(); }));
  $$("[data-pair]").forEach((tile) => (tile.onclick = (e) => {
    if (e.target.closest(".range")) return;
    const i = +tile.dataset.pair, p = d.pairs[i];
    p.on = !p.on; haptic(); tick(p, i);
    refreshModel();
  }));
  $$("[data-price], [data-pmin]").forEach((input) => (input.oninput = () => {
    const high = "price" in input.dataset, p = d.pairs[+(high ? input.dataset.price : input.dataset.pmin)];
    if (high) p.price = input.value; else p.min = input.value;
    if (input.value.trim()) p.on = true;
    refreshModel();
  }));
  const all = $("#selall");
  if (!all) return;
  all.onclick = () => {
    const every = d.pairs.every((p) => p.on);
    d.pairs.forEach((p, i) => { p.on = !every; tick(p, i); });
    haptic(); refreshModel();
  };
  $("#bulkapply").onclick = () => {
    const high = $("#bulkprice").value.trim(), low = $("#bulkmin").value.trim();
    if (!high && !low) return markBad($("#bulkprice").closest(".price"), "Введите цену «от» или «до»");
    d.pairs.forEach((p, i) => {
      if (!p.on) return;
      if (high) $(`[data-price="${i}"]`).value = p.price = high;
      if (low) $(`[data-pmin="${i}"]`).value = p.min = low;
    });
    haptic(); refreshModel(); toast("Цена применена к отмеченным фонам");
  };
}
function suggestedMin() {
  const bulk = $("#bulkmin") ? $("#bulkmin").value.trim() : "";
  return bulk || (S.draft.mono.on ? S.draft.mono.min.trim() : "");
}
// a newly ticked backdrop starts from the price typed for several, the shared monochrome price or the floor
function suggestedPrice(m) {
  const bulk = $("#bulkprice") ? $("#bulkprice").value.trim() : "";
  if (bulk) return bulk;
  if (S.draft.mono.on && S.draft.mono.price.trim()) return S.draft.mono.price.trim();
  const floor = m.floor ?? m.seen_floor;
  return floor != null ? String(floor) : "";
}
function refreshModel() {
  const d = S.draft, byFloor = d.rule !== "fixed", upto = RULE_UPTO[d.rule] || "";
  const shared = !byFloor && d.mono.on ? d.mono.price.trim() : "";
  syncOptions(view, d);
  const monoRow = $('[data-opt="mono"]');
  if (monoRow) { monoRow.classList.toggle("floorpriced", byFloor); $(".floor-note", monoRow).textContent = upto; }
  $$("#ruleseg [data-rule]").forEach((b) => b.classList.toggle("on", b.dataset.rule === d.rule));
  if ($("#rulehint")) $("#rulehint").textContent = ruleHint(d.rule, S.col, currentModel());
  if ($("#pgrid")) $("#pgrid").classList.toggle("floorpriced", byFloor);
  d.pairs.forEach((p, i) => {
    $(`[data-pair="${i}"]`).classList.toggle("on", p.on);
    $(`[data-price="${i}"]`).placeholder = !p.on && shared ? `до ${shared}` : "до";
    $(`[data-pair="${i}"] .floor-note`).textContent = p.on || d.mono.on ? upto : "";
  });
  const ticked = d.pairs.filter((p) => p.on).length;
  if ($("#selall")) {
    $("#selall").textContent = ticked === d.pairs.length ? "Снять все" : "Выбрать все";
    $("#bulk").classList.toggle("hidden", byFloor || ticked < 2);
    $("#pairhint").textContent = byFloor ? "Нажмите на фон, чтобы бот брал его до флора. «Все монохромы» включает сразу все фоны модели."
      : "Нажмите на фон, чтобы бот брал его по своей цене. Цена фона важнее общей цены «Все монохромы».";
  }
  if (draftKey(d) === S.initial) return Save.hide();
  const n = [d.any, d.mono, ...d.pairs].filter((o) => o.on).length;
  Save.show(n ? `Сохранить · ${n} ${plural(n, "позиция", "позиции", "позиций")}` : "Сохранить: не брать эту модель", saveModel);
}
async function saveModel() {
  const c = S.col, m = currentModel(), d = S.draft, floor = d.rule !== "fixed" ? d.rule : null;
  const field = (selector) => $(selector).closest(".price");
  if (d.any.on && !d.any.price.trim()) return markBad(field('[data-opt="any"] [data-max]'), "Укажите цену «до» для «Любой фон»");
  if (d.any.on && reversed(d.any)) return markBad(field('[data-opt="any"] [data-min]'), "«От» больше «до» у «Любой фон»");
  if (!floor) {
    if (d.mono.on && !d.mono.price.trim()) return markBad(field('[data-opt="mono"] [data-max]'), "Укажите цену «до» для «Все монохромы»");
    if (d.mono.on && reversed(d.mono)) return markBad(field('[data-opt="mono"] [data-min]'), "«От» больше «до» у «Все монохромы»");
    const missing = d.pairs.findIndex((p) => p.on && !p.price.trim());
    if (missing >= 0) return markBad(field(`[data-price="${missing}"]`), `Укажите цену «до» для фона ${m.pairs[missing].backdrop}`);
    const upside = d.pairs.findIndex((p) => p.on && reversed(p));
    if (upside >= 0) return markBad(field(`[data-pmin="${upside}"]`), `«От» больше «до» у фона ${m.pairs[upside].backdrop}`);
  }
  Save.busy(true);
  try {
    S.col = await api(`/collections/${encodeURIComponent(c.name)}/picks`, "PUT", {
      model: m.name, autobuy: c.autobuy,
      any_price_ton: d.any.on ? d.any.price.trim() : null,
      any_min_ton: d.any.on ? d.any.min.trim() || null : null,
      monochrome_price_ton: d.mono.on && !floor ? d.mono.price.trim() : null,
      monochrome_min_ton: d.mono.on && !floor ? d.mono.min.trim() || null : null,
      monochrome_rule: d.mono.on && floor ? floor : null,
      pairs: m.pairs.map((p, i) => [p, d.pairs[i]]).filter(([, o]) => o.on).map(([p, o]) => (floor
        ? { backdrop: p.backdrop, rule: floor }
        : { backdrop: p.backdrop, price_ton: o.price.trim(), min_ton: o.min.trim() || null })),
    });
    S.draft = null; Save.hide(); haptic("success"); toast("Сохранено"); changed(true);
    if (S.sub && S.sub.kind === "model") { const y = window.scrollY; drawModel(); window.scrollTo(0, y); }
  } catch (err) { toast(err.message); haptic("error"); }
  finally { Save.busy(false); }
}

// ------------------------------------------------------------------ subscriptions: everything the bot watches and buys
function groupRules(items) {
  const groups = new Map(), other = [], everywhere = [];
  for (const r of items) {
    if (r.plan && !r.collection) { everywhere.push(r); continue; }  // "all monochromes up to a floor"
    if (!r.plan || !r.collection) { other.push(r); continue; }
    const key = r.collection.toLowerCase();
    if (!groups.has(key)) groups.set(key, { collection: r.collection, image: r.image, rules: [], picks: [] });
    const g = groups.get(key);
    g.rules.push(r);
    for (const p of r.pick_items) g.picks.push({ ...p, mono: r.kind === "monochrome" });
  }
  const list = [...groups.values()].map((g) => ({
    ...g, title: titleOf(g.collection), ids: g.rules.map((r) => r.id).join(","),
    enabled: g.rules.some((r) => r.enabled), autobuy: g.rules.some((r) => r.autobuy),
    picks: g.picks.sort((a, b) => (a.model || "").localeCompare(b.model || "", "ru") || b.backdrops.length - a.backdrops.length),
  }));
  return { groups: list.sort(byTitle), other, everywhere };
}
function pickLine(p) {
  const what = p.backdrops.length ? `⚫ ${p.backdrops.join(", ")}` : p.mono ? "⚫ все монохромы" : "любой фон";
  const top = RULE_UPTO[p.rule] || `до ${ton(p.price)}`;
  const limit = p.min != null ? `от ${ton(p.min)} ${top}` : top;
  return `<div class="pk"><span><b>${esc(p.model || "Вся коллекция")}</b> · ${esc(what)}</span><span class="pr">${esc(limit)}</span></div>`;
}
const stateText = (r) => (!r.enabled ? "⏸ выключено" : r.autobuy ? "🛒 покупает сам" : "🔔 присылает листинги");
// a subscription's own notification switch, or the common one from the profile when it has none
const notifyNew = (r) => r.notify_new ?? !!(S.me.notify.matching_only || S.me.notify.all_listings);
const notifyPrice = (r) => r.notify_price ?? !!S.me.notify.price_drops;
function ruleActions(r, edit) {
  return `<div class="ractions">${edit ? `<button class="pbtn" data-edit="${esc(edit)}">Изменить</button>` : ""}
    ${S.me.can_purchase ? `<button class="pbtn" data-ab="${r.ids}" data-v="${r.autobuy ? 0 : 1}">${r.autobuy ? "🔔 Листинги" : "🛒 Покупать"}</button>` : ""}

}
function groupCard(g) {

    <div class="rhead">${thumb(g.image, g.title)}
      <div class="grow"><b>${esc(g.title)}</b><div class="sub">${stateText(g)} · ${g.picks.length} ${plural(g.picks.length, "позиция", "позиции", "позиций")}</div></div>
      <label class="switch"><input type="checkbox" data-en="${g.ids}" ${g.enabled ? "checked" : ""}><span></span></label></div>
    <div class="picks">${g.picks.slice(0, 6).map(pickLine).join("")}${more}</div>${ruleActions(g, g.collection)}</div>`;
}
function everywhereCard(r) {
  const rule = { ...r, ids: String(r.id) }, top = r.pick_items.map((p) => RULE_UPTO[p.rule]).filter(Boolean).join(", ");
  return `<div class="rcard${r.enabled ? "" : " paused"}">
    <div class="rhead"><div class="thumb"><span class="letter">⚫</span></div>

function subText(r) {

  else parts.push(r.backdrops.length ? listText(r.backdrops) : "все фоны");
  if (r.symbols.length) parts.push(`узор ${listText(r.symbols)}`);

function chatRuleCard(r) {
  const rule = { ...r, ids: String(r.id) };

    <div class="rhead"><div class="grow"><b>${esc(r.name)}</b><div class="sub">${stateText(r)}</div>

async function renderSubs() {
  const id = newScreen();
  view.innerHTML = head("Подписки") + skeletonRows(3);

  try { [items] = await Promise.all([api("/rules").then((r) => r.items), ensureCollections().catch(() => null)]); }

    <button class="btn soft" data-search="1" style="margin-top:16px">＋ Новая подписка</button>`
    : empty("📋", "Подписок пока нет", "Выберите коллекцию, модели и фоны — бот будет присылать или сам покупать такие подарки.",
      '<button class="btn" data-search="1">＋ Новая подписка</button>'));
  const ids = (el, key) => el.dataset[key].split(",").filter(Boolean);
  $$("[data-en]").forEach((el) => (el.onchange = () => patchRules(ids(el, "en"), { enabled: el.checked })));
  $$("[data-ab]").forEach((el) => (el.onclick = () => patchRules(ids(el, "ab"), { autobuy: el.dataset.v === "1" })));
  $$("[data-tp]").forEach((el) => (el.onclick = () => patchRules([el.dataset.id], { [el.dataset.tp]: el.dataset.v === "1" })));
  $$("[data-edit]").forEach((el) => (el.onclick = () => { haptic(); openPlan(el.dataset.edit); }));
  $$("[data-subedit]").forEach((el) => (el.onclick = () => { haptic(); editSubscription(items.find((r) => String(r.id) === el.dataset.subedit)); }));
  $$("[data-del]").forEach((el) => (el.onclick = async () => {
    if (!(await confirmBox("Удалить? Бот перестанет это брать и присылать."))) return;

    catch (err) { toast(err.message); }
    changed(); rerenderSubs();
  }));
  if (S.highlight) {

function drawStatus() {
  const m = S.me;
  const buying = m.run_mode === "live", listings = !!m.notify.matching_only;
  const [title, text] = m.stopped ? ["⛔ Все покупки остановлены", m.is_admin ? "Аварийная остановка. Снять её можно внизу страницы." : "Аварийная остановка. Снять её может администратор."]
    : m.run_mode === "dry_run" ? ["🧪 Тестовый режим", "Покупки только имитируются: бот пришлёт «был бы куплен»."]
    : buying && listings ? ["💸 Покупает и 🔔 присылает листинги", "Что отмечено «Покупать», бот покупает сам; остальное по вашему выбору присылает листингом."]
    : buying ? ["💸 Покупает", "Бот покупает выбранное за TON с баланса MRKT, в пределах лимитов. Листинги не присылает."]
    : listings ? ["🔔 Только листинги", "Бот ничего не покупает и присылает листинги подарков по вашему выбору."]
    : ["⏸ Выключен", "Бот не покупает и не присылает листинги."];
  const cls = m.stopped ? "stop" : m.run_mode === "dry_run" ? "dry_run" : buying ? "live" : "notify_only";

    <div class="label">Режимы</div>${workCard(m)}${speedCard(m)}`;
  const buy = $("#buyswitch");
  buy.onchange = () => {
    const want = buy.checked;
    buy.checked = !want;  // shown as the bot has it until the change is saved
    setMode(want ? "live" : "notify_only");
  };
  $("#work [data-notify]").onchange = (e) => savePrefs({ notify: { matching_only: e.target.checked } });
  $$("#work [data-everywhere]").forEach((el) => (el.onchange = async () => {

  if (resume) resume.onclick = async () => {
    try { S.me = await api("/resume", "POST"); haptic("success"); toast("Остановка снята"); } catch (err) { toast(err.message); }

function dayLabel(d) {
  const today = new Date(), yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "Сегодня";
  if (d.toDateString() === yesterday.toDateString()) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}

  const id = newScreen(), top = subHead("История покупок", "куплено, «был бы куплен» и неудачные попытки");

function toggleNotify(key, title) {

// ------------------------------------------------------------------ 🤖 resale assistant: settings, how it decides, its gifts
const RESALE_ICON = { listed: "📤", sold: "💰", bought: "🛍", waiting: "⏳", failed: "⚠️", dry_run: "🧪" };
const PERIODS = [[3, "3 дня"], [7, "7 дней"], [14, "14 дней"]];
const draftOf = (s, on) => ({
  enabled: on, min_profit: asText(s.min_profit), fee: asText(s.fee_percent), period: s.period_days, min_sales: asText(s.min_sales),
  auto_list: s.auto_list, max_price: asText(s.max_price), daily: asText(s.daily), max_count: asText(s.max_count), collections: [...s.collections],
});
const adraftKey = (d) => JSON.stringify({ ...d, enabled: null });
const floor2 = (v) => Math.floor(v * 100 + 1e-9) / 100;
async function renderAssistant() {
  const id = newScreen(), top = subHead("🤖 ИИ-ассистент", "покупает дешевле рынка и выставляет на продажу");
  view.innerHTML = top + skeletonRows(4);
  let data;
  try { [data] = await Promise.all([api("/assistant"), ensureCollections().catch(() => null)]); }
  catch (err) { if (!stale(id)) fail(err, renderAssistant, top); return; }
  if (stale(id)) return;
  S.assistant = data;
  S.adraft = draftOf(data.settings, data.on);
  S.asaved = adraftKey(S.adraft);
  drawAssistant();
}
function assistantNote(a) {
  if (!a.can_purchase) return "У вас нет права на покупки — ассистент для вас недоступен.";
  if (S.me && S.me.stopped) return "Включена аварийная остановка: ассистент не покупает и не выставляет.";
  return { live: "Покупает и выставляет по-настоящему, за TON с баланса MRKT.",
    dry_run: "Тестовый режим: ассистент только пишет, что купил бы и за сколько выставил бы.",
    notify_only: "«💸 Покупать» в профиле выключено — ассистент не покупает." }[a.run_mode] || "";
}
function drawAssistant() {
  newScreen();
  const a = S.assistant, d = S.adraft, t = a.totals;
  const fee = tonValue(d.fee) || 0, profit = tonValue(d.min_profit) || 0;
  const listAt = floor2(10 / (1 + fee / 100)), maxBuy = floor2(listAt - profit);
  const cols = d.collections.length ? d.collections.map(titleOf).join(", ") : "все коллекции";
  const field = (key, title, sub, value, placeholder, suffix = "TON") => `<div class="fieldrow"><div class="grow"><b>${title}</b>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
    ${priceField(`data-a="${key}"`, value, placeholder, "", suffix)}</div>`;
  view.innerHTML = subHead("🤖 ИИ-ассистент", "покупает дешевле рынка и выставляет на продажу") + `
    <div class="card"><div class="line"><div class="grow"><b>${a.on ? "Ассистент включён" : "Ассистент выключен"}</b><div class="sub">${esc(assistantNote(a))}</div></div>
      <label class="switch"><input type="checkbox" id="aon" ${d.enabled ? "checked" : ""} ${a.can_purchase ? "" : "disabled"}><span></span></label></div></div>
    <div class="stats"><div><span>Продано</span><b>${t.sold}</b><span class="profit">${t.sold ? `+${ton(t.sold_profit)}` : "—"}</span></div>
      <div><span>На продаже</span><b>${t.listed}</b><span>${t.listed ? `≈ +${ton(t.listed_profit)}` : "—"}</span></div>
      <div><span>Ждут</span><b>${t.open}</b><span>${t.dry_run ? `тест: ${t.dry_run}` : "выставления"}</span></div></div>
    <div class="label">Как он решает</div>
    <div class="card" style="padding:12px 14px"><ol class="steps">
      <li>Смотрит, за сколько покупали <b>ту же модель на том же фоне</b> (то же фото) за последние <b>${d.period} дн.</b>, — берёт медиану. Если таких продаж меньше <b>${esc(d.min_sales || "—")}</b> — продажи модели на любом фоне.</li>
      <li>Если такой же подарок сейчас продаётся дешевле — ставит цену на <b>0.01 TON ниже</b> него.</li>
      <li>MRKT прибавляет к цене продавца <b>${esc(d.fee || "0")}%</b> комиссии — поэтому выставляет за оценку ÷ ${num(1 + fee / 100, 4)}.</li>
      <li>Покупает, если <b>цена выставления − цена покупки ≥ ${esc(d.min_profit || "0")} TON</b>, и выставляет подарок сразу после подтверждения покупки MRKT.</li>
    </ol><div class="example">Например, такие подарки продавались за <b>10 TON</b> → выставит за <b>${num(listAt, 2)} TON</b>
      (покупатели увидят ≈ ${num(listAt * (1 + fee / 100), 3)} TON) → купит не дороже <b>${num(Math.max(0, maxBuy), 2)} TON</b>.</div></div>
    <div class="label">Настройки</div>
    <div class="card" id="asettings">
      ${field("min_profit", "Мин. профит", "после комиссии MRKT", d.min_profit, "0.3")}
      ${field("fee", "Комиссия MRKT", "добавляется к цене продавца", d.fee, "2", "%")}
      <div class="fieldrow"><div class="grow"><b>Продажи за</b></div></div>
      <div class="seg seg3" id="aperiod" style="margin:0 0 12px">${PERIODS.map(([v, title]) => `<button data-p="${v}" class="${d.period === v ? "on" : ""}">${title}</button>`).join("")}</div>
      ${field("min_sales", "Мин. продаж", "чтобы оценке можно было верить", d.min_sales, "3", "шт")}
      ${field("max_price", "Макс. цена подарка", "дороже не покупает", d.max_price, "—")}
      ${field("daily", "Бюджет в день", "своя сумма ассистента", d.daily, "—")}
      ${field("max_count", "Купить штук", "всего, потом остановится", d.max_count, "—", "шт")}
      <div class="line"><div class="grow"><b>Сразу выставлять на продажу</b><div class="sub">после подтверждения покупки MRKT</div></div>
        <label class="switch"><input type="checkbox" id="alist" ${d.auto_list ? "checked" : ""}><span></span></label></div>
      <button class="line" id="acols" style="width:100%;text-align:left"><div class="grow"><b>Коллекции</b><div class="sub">${esc(cols)}</div></div><span class="chev">›</span></button>
    </div>
    <p class="hint">Общие лимиты из профиля действуют и для ассистента. Ассистент не покупает подарки, которые уже купил.</p>
    <div class="label">Подарки ассистента${a.positions.length ? ` · ${a.positions.length}` : ""}</div>
    <div id="apos">${a.positions.length ? a.positions.map(positionCard).join("")
      : empty("🤖", "Пока ничего", "Здесь появятся подарки, которые ассистент купил и выставил, — и тестовые «был бы куплен».")}</div>
    <p class="foot">Оценка — по продажам, которые бот видел в ленте MRKT${a.sales_seen_since ? ` с ${new Date(a.sales_seen_since).toLocaleDateString("ru-RU", { day: "numeric", month: "long" })}` : ""}.
      Чем дольше бот работает, тем больше продаж он знает. «ИИ» здесь — прозрачная формула выше, без догадок.</p>`;
  $("#aon").onchange = (e) => toggleAssistant(e.target);
  $$("[data-a]").forEach((input) => (input.oninput = () => { d[input.dataset.a] = input.value; assistantChanged(); }));
  $$("#aperiod [data-p]").forEach((b) => (b.onclick = () => {
    d.period = +b.dataset.p; haptic();
    $$("#aperiod [data-p]").forEach((x) => x.classList.toggle("on", x === b));
    assistantChanged();
  }));
  $("#alist").onchange = (e) => { d.auto_list = e.target.checked; haptic(); assistantChanged(); };
  $("#acols").onclick = () => { haptic(); openAssistantCollections(); };
  $$("[data-list]").forEach((b) => (b.onclick = () => listPosition(b)));
}
function positionCard(p) {
  const profit = p.profit != null ? `<span class="profit${p.profit < 0 ? " neg" : ""}">${p.profit >= 0 ? "+" : ""}${ton(p.profit)}</span>` : "—";
  const nums = [`куплен за <b>${ton(p.buy)}</b>`];
  if (p.list != null) nums.push(`${p.status === "listed" || p.status === "sold" ? "выставлен за" : "выставит за"} <b>${ton(p.list)}</b>${p.target != null ? ` (покупатели: ${ton(p.target)})` : ""}`);
  if (p.sold_price != null) nums.push(`продан за <b>${ton(p.sold_price)}</b>`);
  nums.push(`профит ${profit}${p.sales ? ` · по ${p.sales} ${plural(p.sales, "продаже", "продажам", "продажам")}` : ""}`);
  const when = p.sold_at || p.listed_at || p.created_at;
  return `<div class="poscard"><div class="ptop"><span class="picon">${RESALE_ICON[p.status] || "•"}</span>
      <div class="grow"><div class="lt">${esc(p.name || "Подарок")}</div><div class="sub">${esc([p.model, p.backdrop].filter(Boolean).join(" · "))}${when ? ` · ${ago(when)}` : ""}</div>
        <span class="st ${esc(p.status)}">${esc(p.status_label)}</span></div></div>
    <div class="pnums">${nums.join("<br>")}</div>${p.reason ? `<div class="why">${esc(p.reason)}</div>` : ""}
    ${p.can_list ? `<button class="btn soft" data-list="${p.id}">📤 Выставить за ${ton(p.list)}</button>` : ""}</div>`;
}
function assistantChanged() {
  if (adraftKey(S.adraft) === S.asaved) Save.hide(); else Save.show("Сохранить настройки", () => saveAssistant());
}
function assistantBody(d, enabled) {
  const value = (v) => (String(v).trim() ? String(v).trim().replace(",", ".") : null);
  return {
    enabled, min_profit_ton: value(d.min_profit) || "0", fee_percent: tonValue(d.fee) || 0, period_days: d.period,
    min_sales: parseInt(d.min_sales, 10) || 1, auto_list: d.auto_list, max_price_ton: value(d.max_price), daily_ton: value(d.daily),
    max_count: value(d.max_count) ? parseInt(d.max_count, 10) : null, collections: d.collections,
  };
}
async function saveAssistant(enabled = S.assistant.on, message = "Настройки ассистента сохранены") {
  const d = S.adraft;
  if (!String(d.min_profit).trim() || !(tonValue(d.min_profit) >= 0)) return markBad($('[data-a="min_profit"]').closest(".price"), "Укажите минимальный профит");
  if (!(tonValue(d.fee) >= 0) || tonValue(d.fee) > 50) return markBad($('[data-a="fee"]').closest(".price"), "Комиссия — от 0 до 50%");
  if (!(parseInt(d.min_sales, 10) >= 1)) return markBad($('[data-a="min_sales"]').closest(".price"), "Минимум продаж — от 1");
  Save.busy(true);
  try {
    S.assistant = await api("/assistant", "PUT", assistantBody(d, enabled));
    S.adraft = draftOf(S.assistant.settings, S.assistant.on);
    S.asaved = adraftKey(S.adraft);
    Save.hide();
    if (S.sub && S.sub.kind === "assistant") { const y = window.scrollY; drawAssistant(); window.scrollTo(0, y); }
    haptic("success"); toast(message);
    loadMe().catch(() => {});
    return true;
  } catch (err) { toast(err.message); haptic("error"); return false; }
  finally { Save.busy(false); }
}
async function toggleAssistant(box) {
  const want = box.checked;
  box.checked = !want;  // shown as the bot has it until the change is saved
  if (want && !(await confirmBox(S.assistant.run_mode === "live"
    ? "Ассистент будет сам покупать подарки за TON с баланса MRKT и выставлять их на продажу — в пределах лимитов. Включить?"
    : "Включить ассистента? Сейчас покупки не настоящие: он будет только писать, что купил бы."))) return;
  haptic();
  await saveAssistant(want, want ? "Ассистент включён" : "Ассистент выключен");
}
function openAssistantCollections() {
  const d = S.adraft;
  const draw = (root) => {
    const text = norm($("#acq", root).value);
    const items = sortedCollections().filter((c) => !text || norm(c.title).includes(text) || norm(c.name).includes(text));
    $("#aclist", root).innerHTML = `<button class="opt-line" data-all="1"><div class="grow"><b>Все коллекции</b><div class="sub">и новые тоже</div></div>${d.collections.length ? "" : '<span class="tick">✓</span>'}</button>`
      + items.map((c) => `<button class="opt-line" data-c="${esc(c.name)}">${thumb(c.image, c.title)}<div class="grow"><b>${esc(c.title)}</b>
        <div class="sub">${esc(ton(c.floor))}</div></div>${has(d.collections, c.name) ? '<span class="tick">✓</span>' : ""}</button>`).join("");
    $("[data-all]", root).onclick = () => { d.collections = []; haptic(); draw(root); assistantChanged(); };
    $$("[data-c]", root).forEach((b) => (b.onclick = () => { d.collections = toggleIn(d.collections, b.dataset.c); haptic(); draw(root); assistantChanged(); }));
  };
  Sheet.open(`<h3>Коллекции ассистента</h3><p class="sub" style="margin:0 2px 6px">Где ассистент ищет подарки для перепродажи</p>
    <div class="search">${ICON.search}<input id="acq" type="search" placeholder="Найти коллекцию" autocomplete="off" enterkeyhint="search"></div>
    <div id="aclist"></div><button class="btn" id="acdone" style="margin-top:14px">Готово</button>`, (root) => {
    $("#acq", root).oninput = () => draw(root);
    $("#acdone", root).onclick = () => { Sheet.close(); drawAssistant(); assistantChanged(); };
    withCollections(root, "#aclist", draw);
  });
}
async function listPosition(button) {
  button.disabled = true; button.textContent = "Выставляю…"; haptic();
  try {
    const res = await api(`/assistant/positions/${button.dataset.list}/list`, "POST");
    toast(res.text); haptic(res.status === "listed" ? "success" : "warning");
    S.assistant = res.assistant;
    const y = window.scrollY; drawAssistant(); window.scrollTo(0, y);
  } catch (err) { toast(err.message); haptic("error"); button.disabled = false; button.textContent = "📤 Выставить"; }
}

// ------------------------------------------------------------------ 📋 orders: the account's MRKT orders, who beat them, the market
const tonN = (nano) => ton(nano == null ? null : nano / 1e9);
const orderWhat = (o) => [o.model && `модель ${o.model}`, o.backdrop && `фон ${o.backdrop}`, o.symbol && `символ ${o.symbol}`].filter(Boolean).join(" · ") || "любой подарок коллекции";
function floorLines(floors, next) {
  return floors.map((f) => {
    const gap = f.price_nano != null && next != null ? f.price_nano - next : null;
    const diff = gap == null ? "" : `<div class="sub">на ${tonN(Math.abs(gap))} ${gap >= 0 ? "выше" : "ниже"} нового ордера</div>`;
    return `<div class="pk"><span>Флор ${esc(f.label)}${diff}</span><span class="pr">${f.price_nano != null ? tonN(f.price_nano) : "нет объявлений"}</span></div>`;
  }).join("");
}
function orderCard(v) {
  const o = v.order, c = collectionOf(o.collection) || {};
  const state = v.outbid ? `<div class="oalert">⚠️ Перебили: ${tonN(v.top.price_nano)} — ордер другого покупателя</div>`
    : v.top && v.top.id !== o.id ? `<div class="ofirst">Такая же цена у другого ордера: ${tonN(v.top.price_nano)}</div>`
    : v.top ? '<div class="ofirst">✓ Ваш ордер — самый высокий</div>' : "";
  return `<div class="rcard ocard"><div class="rhead">${thumb(c.image, c.title || o.collection)}
      <div class="grow"><b>${esc(c.title || o.collection || "Коллекция")}</b><div class="sub">${esc(orderWhat(o))}</div></div>
      <div class="lr"><b>${tonN(o.price_nano)}</b><div class="sub">ваш ордер</div></div></div>
    ${state}<div class="picks">${floorLines(v.floors, v.next_price_nano)}</div>
    ${v.outbid ? `<button class="btn" data-outbid="${esc(o.id)}" data-price="${v.next_price_nano}">⚡ Перебить на 0.01 → ${tonN(v.next_price_nano)}</button>` : ""}</div>`;
}
async function renderOrders() {
  const id = newScreen(), m = S.me;
  view.innerHTML = subHead("📋 Ордера", "ваши и чужие ордера на MRKT") + `
    <div class="card"><div class="line"><div class="grow"><b>Предупреждать, когда перебили</b>
      <div class="sub">сообщение в чат с флором модели или фона и кнопкой «Перебить на 0.01»</div></div>
      <label class="switch"><input type="checkbox" id="onotify" ${m.notify.orders_outbid ? "checked" : ""}><span></span></label></div></div>
    <div class="label">Мои ордера</div><div id="omine">${skeletonRows(2)}</div>
    <div class="label">Ордера рынка</div><div id="omarket"></div>
    <p class="hint">Перебить — значит отменить ваш ордер и сразу поставить новый на 0.01 TON выше лучшего. Бот сообщает об успехе, только когда MRKT
      покажет новый ордер. Цена не выше лимита на одну покупку из профиля.</p>`;
  $("#onotify").onchange = async (e) => {
    const on = e.target.checked;
    e.target.checked = !on;
    await savePrefs({ notify: { orders_outbid: on } }, on ? "Предупреждения о перебитых ордерах включены" : "Предупреждения выключены");
    if ($("#onotify")) $("#onotify").checked = !!S.me.notify.orders_outbid;
  };

async function loadMyOrders(id) {
  const box = () => $("#omine");
  let data;
  try { data = await api("/orders/mine"); }
  catch (err) {
    if (stale(id) || !box()) return;
    box().innerHTML = empty("😕", "Не получилось загрузить ордера", err.message, '<button class="btn" id="oretry">Повторить</button>');
    $("#oretry").onclick = () => { box().innerHTML = skeletonRows(2); loadMyOrders(id); };
    return;
  }
  if (stale(id) || !box()) return;
  box().innerHTML = data.items.length ? data.items.map(orderCard).join("")
    : empty("📋", "Ордеров нет", "Когда вы поставите ордер на MRKT, он появится здесь — с ценой лучшего ордера и флором.");
  $$("[data-outbid]").forEach((b) => (b.onclick = () => outbidOrder(b, id)));
}
async function outbidOrder(button, id) {
  const price = button.dataset.price;
  button.disabled = true; button.textContent = "Перебиваю…"; haptic();
  try {
    const res = await api("/orders/outbid", "POST", { order_id: button.dataset.outbid, price_nano: +price });
    toast(res.text); haptic(res.ok ? "success" : "warning");
  } catch (err) { toast(err.message); haptic("error"); }
  if (!stale(id)) loadMyOrders(id);
}
async function drawMarketOrders() {
  const box = $("#omarket"), o = S.orders;
  if (!box) return;
  if (!o.collection || !collectionOf(o.collection)) o.collection = S.q.name && collectionOf(S.q.name) ? S.q.name : (sortedCollections()[0] || {}).name;
  if (!o.collection) { box.innerHTML = empty("🎁", "Коллекции ещё не загружены", "Бот получает их с MRKT раз в час."); return; }
  const c = collectionOf(o.collection) || { title: o.collection };
  const chips = (kind, list) => `<div class="chips">${[null, ...list].map((name) => `<button class="chip${(o[kind] || null) === name ? " on" : ""}"
    data-${kind}="${esc(name || "")}">${esc(name || (kind === "model" ? "Все модели" : "Все фоны"))}</button>`).join("")}</div>`;
  const detail = o.detail && o.detail.name === o.collection ? o.detail : null;
  box.innerHTML = `<button class="colbtn" id="ocol" style="width:100%"><span class="ci"><span class="letter">${esc((c.title || "?")[0])}</span>${pic(c.image)}</span>
      <span class="ct">${esc(c.title)}</span></button>
    ${detail ? chips("model", detail.models.map((x) => x.name)) + chips("backdrop", detail.backdrops.map((x) => x.name)) : '<div class="skel sline" style="margin:14px 0"></div>'}
    <div id="olist">${skeletonRows(3)}</div>`;
  const id = screen;
  $("#ocol").onclick = () => { haptic(); openPicker((name) => { Object.assign(o, { collection: name, model: null, backdrop: null }); drawMarketOrders(); }, o.collection); };
  $$("[data-model]").forEach((b) => (b.onclick = () => { haptic(); o.model = b.dataset.model || null; drawMarketOrders(); }));
  $$("[data-backdrop]").forEach((b) => (b.onclick = () => { haptic(); o.backdrop = b.dataset.backdrop || null; drawMarketOrders(); }));
  if (!detail) {
    api("/collections/" + encodeURIComponent(o.collection)).then((d) => { o.detail = d; if (!stale(id) && o.collection === d.name) drawMarketOrders(); })
      .catch(() => { o.detail = { name: o.collection, models: [], backdrops: [] }; if (!stale(id)) drawMarketOrders(); });
    return;
  }
  const q = new URLSearchParams({ collection: o.collection });
  if (o.model) q.set("model", o.model);
  if (o.backdrop) q.set("backdrop", o.backdrop);
  const req = ++o.req;  // the answer to an older choice must not replace the newer one
  let data;
  try { data = await api("/orders/market?" + q.toString()); }
  catch (err) { if (!stale(id) && req === o.req && $("#olist")) $("#olist").innerHTML = empty("😕", "Не получилось загрузить", err.message); return; }
  if (stale(id) || req !== o.req || !$("#olist")) return;
  $("#olist").innerHTML = (data.items.length ? `<div class="card">${data.items.map((x) => `<div class="orow"><div class="grow"><b>${tonN(x.price_nano)}</b>${x.mine ? '<span class="mine">ваш</span>' : ""}
      <div class="sub">${esc(orderWhat(x))}${x.quantity ? ` · ${x.quantity} шт` : ""}</div></div></div>`).join("")}</div>`
    : empty("📭", "Ордеров нет", "Для такого выбора на MRKT сейчас нет ордеров."))
    + (data.floors.length ? `<div class="card" style="padding:4px 14px">${floorLines(data.floors, null)}</div>` : "");
}

// ------------------------------------------------------------------ start
function applyTheme() {
  if (!tg || !tg.isVersionAtLeast) return;
  try {
    if (tg.isVersionAtLeast("6.9")) { tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); }
    if (tg.isVersionAtLeast("7.10") && tg.setBottomBarColor) tg.setBottomBarColor("#0d0d0d");
    if (tg.isVersionAtLeast("7.7") && tg.disableVerticalSwipes) tg.disableVerticalSwipes();  // scrolling must not close the app
  } catch (e) { /* old clients */ }
}
// on phones the keyboard would push the bottom bar over the field being typed in
if (tg && ["android", "ios"].includes(tg.platform)) {
  document.addEventListener("focusin", (e) => { if (e.target.matches("input:not([type=checkbox])")) document.body.classList.add("typing"); });
  document.addEventListener("focusout", () => setTimeout(() => {
    if (!document.activeElement || !document.activeElement.matches("input:not([type=checkbox])")) document.body.classList.remove("typing");
  }, 60));
}
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input")) e.target.blur(); });
(async () => {
  applyTheme();
  if (!tg || !tg.initData) {
    $("#tabbar").hidden = true;
    view.innerHTML = empty("📱", "Откройте приложение из Telegram", "Кнопка «Снайпер» в чате с ботом или команда /app.");
    return;
  }
  tg.ready(); tg.expand();
  try { await loadMe(); } catch (err) { return fail(err, () => location.reload()); }
  render();
})();
</script>
