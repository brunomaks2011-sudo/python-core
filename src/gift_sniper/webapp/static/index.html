<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Снайпер MRKT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --box: #0b0d11;
    --text: #f2f3f5;
    --hint: #8d939e;
    --accent: var(--tg-theme-button-color, #3b82f6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: #5ea2ff;
    --danger: #ef5b5b;
    --line: rgba(255, 255, 255, .09);
    --ok: #3ccf7a;
    --warn: #e6b422;
    --mono: #a78bfa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 14px 110px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 .brand { color: var(--mono); }
  h3 { font-size: 15px; margin: 16px 2px 8px; color: var(--hint); font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--card); color: var(--hint); font-weight: 600; }
  .pill.live { background: rgba(60, 207, 122, .18); color: var(--ok); }
  .pill.test { background: rgba(230, 180, 34, .18); color: var(--warn); }
  .pill.stop { background: rgba(239, 91, 91, .2); color: var(--danger); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px 12px; padding: 0 14px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-weight: 600; }
  .tab.active { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .crumbs { font-size: 14px; margin: 0 2px 10px; color: var(--hint); }
  .crumbs a { color: var(--link); text-decoration: none; cursor: pointer; }
  .card { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--line); }
  .tap { cursor: pointer; }
  .tap:active { opacity: .8; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; margin-bottom: 12px; }
  .gcard.taken { border-color: rgba(59, 130, 246, .7); }
  .gimg { position: relative; height: 150px; border-radius: 14px; background: var(--box); overflow: hidden;
    display: grid; place-items: center; }
  .gimg img { position: relative; height: 100%; max-width: 100%; object-fit: contain; z-index: 1; }
  .gimg.tall { height: 190px; }
  .gimg .initial { position: absolute; font-size: 54px; font-weight: 800; color: rgba(255, 255, 255, .12); }
  .gimg .corner { position: absolute; top: 8px; right: 8px; z-index: 2; }
  .gbody { padding: 10px 4px 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .07);
    border: 1px solid var(--line); }
  .badge.rule { background: var(--warn); color: #1b1600; border-color: transparent; }
  .badge.mono { background: rgba(167, 139, 250, .18); color: var(--mono); border-color: transparent; }
  .badge.ok { background: rgba(60, 207, 122, .18); color: var(--ok); border-color: transparent; }
  .lvl { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; }
  .lvl.t-high { background: #6d28d9; } .lvl.t-medium { background: #2563eb; } .lvl.t-low { background: #0f766e; }
  .lvl.t-combo { background: #b45309; }
  input, select { width: 100%; background: var(--box); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px; font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  input.price { width: 130px; flex: none; padding: 9px 10px; text-align: right; }
  .controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 11px;
    font: inherit; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700;
    background: var(--accent); color: var(--accent-text); margin-top: 10px; }
  .btn.ghost { background: transparent; color: var(--link); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(239, 91, 91, .4); }
  .btn:disabled { opacity: .5; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: rgba(255, 255, 255, .18); border-radius: 999px; transition: .2s; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff;
    border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::before { transform: translateX(18px); }
  .box { width: 26px; height: 26px; flex: none; accent-color: var(--accent); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .field { margin: 12px 0; }
  .field label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 5px; }
  .check { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px; }
  .stat div { background: var(--box); border-radius: 12px; padding: 8px 4px; text-align: center; }
  .stat b { display: block; font-size: 16px; }
  .stat span { font-size: 11px; color: var(--hint); }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; max-width: 720px; margin: 0 auto; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #000d; color: #fff; padding: 10px 16px;
    border-radius: 12px; z-index: 20; font-size: 14px; display: none; max-width: 90vw; text-align: center; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: var(--link); }
</style>
</head>
<body>
<h1><span>Монохромы <span class="brand">MRKT</span></span><span id="mode" class="pill"></span></h1>
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="collections">Коллекции</button>
  <button class="tab" data-tab="rules">Что берёт бот</button>
  <button class="tab" data-tab="settings">Лимиты</button>
  <button class="tab" data-tab="history">История</button>
</div>
<div id="view"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) try { tg.setHeaderColor("#0f1115"); tg.setBackgroundColor("#0f1115"); } catch (e) { /* old clients */ } }
const S = { me: null, collections: null, sort: "taken", query: "", tab: "collections", col: null, page: "list" };
const view = document.getElementById("view");

// ------------------------------------------------------------------ helpers
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 3) => (+v).toLocaleString("ru-RU", { maximumFractionDigits: d });
const ton = (v) => v == null ? "—" : `${num(v)} TON`;
const pct = (v) => v == null ? "—" : `${num(v, v < 10 ? 2 : 1)}%`;
const haptic = () => tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
const LEVELS = ["high", "medium", "low", "combo"];
const COLOR = /^#[0-9a-f]{6}$/i;
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 2600);
}
async function api(path, method = "GET", body) {
  const res = await fetch("/api" + path, {
    method,
    headers: { Authorization: "tma " + ((tg && tg.initData) || ""), "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
  return data;
}
function spinner() { view.innerHTML = '<div class="spinner"></div>'; }
function fail(err) { view.innerHTML = `<div class="card"><b>Не получилось загрузить</b><div class="muted">${esc(err.message)}</div></div>`; }
// a picture that falls back to a second URL, then disappears (the letter behind it stays)
function pic(src, fallback) {
  const first = src || fallback;
  if (!first) return "";
  const fb = src && fallback ? ` data-fb="${esc(fallback)}"` : "";
  return `<img src="${esc(first)}"${fb} loading="lazy" onload="imgOk(this)" onerror="imgFail(this)">`;
}
window.imgFail = (el) => { const fb = el.dataset.fb; if (fb) { delete el.dataset.fb; el.src = fb; } else el.remove(); };
window.imgOk = (el) => { const letter = el.parentElement && el.parentElement.querySelector(".initial"); if (letter) letter.remove(); };
function backdrop(center, edge) {
  if (!COLOR.test(center || "")) return "";
  const outer = COLOR.test(edge || "") ? edge : center;
  return ` style="background: radial-gradient(circle at 50% 45%, ${center} 0%, ${outer} 78%)"`;
}
function level(type) {
  const t = LEVELS.includes(type) ? type : "low";
  return `<span class="lvl t-${t}">${esc(type || "?")}</span>`;
}
function confirmBox(text) {
  return new Promise((resolve) => tg && tg.showConfirm ? tg.showConfirm(text, resolve) : resolve(window.confirm(text)));
}

// ------------------------------------------------------------------ navigation
function setBack() {
  if (!tg || !tg.BackButton) return;
  S.tab === "collections" && S.page !== "list" ? tg.BackButton.show() : tg.BackButton.hide();
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => back());
function back() {
  if (S.page === "model") { S.page = "collection"; drawCollection(); }
  else { S.page = "list"; renderCollections(); }
  setBack(); window.scrollTo(0, 0);
}
document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab"); if (!tab) return;
  haptic(); showTab(tab.dataset.tab);
});
function showTab(tab) {
  S.tab = tab;
  if (tab === "collections") S.page = "list";
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
  setBack();
  ({ collections: renderCollections, rules: renderRules, settings: renderSettings, history: renderHistory })[tab]();
}
view.addEventListener("click", (e) => {
  const go = e.target.closest("[data-goto]");
  if (go) return showTab(go.dataset.goto);
  const nav = e.target.closest("[data-nav]");
  if (!nav) return;
  if (nav.dataset.nav === "list") { S.page = "list"; renderCollections(); }
  else { S.page = "collection"; drawCollection(); }
  setBack(); window.scrollTo(0, 0);
});

// ------------------------------------------------------------------ status
async function loadMe() {
  S.me = await api("/me");
  const el = document.getElementById("mode");
  const m = S.me;
  if (m.stopped) { el.className = "pill stop"; el.textContent = "⛔ остановлен"; }
  else if (m.run_mode === "live") { el.className = "pill live"; el.textContent = "● live"; }
  else { el.className = "pill test"; el.textContent = m.run_mode === "dry_run" ? "🧪 тест" : "🔔 уведомления"; }
}
function readiness() {
  const m = S.me; if (!m || m.ready) return "";
  const items = m.checklist.filter((c) => !c.ok).map((c) => `<div class="check"><b>⚠️</b><span class="grow">${esc(c.text)}</span>${
    c.action ? `<button class="chip" data-goto="${esc(c.action)}">Настроить</button>` : ""}</div>`).join("");
  return `<div class="card"><b>Чтобы бот начал покупать</b>${items}</div>`;
}

// ------------------------------------------------------------------ collections
async function renderCollections() {
  spinner();
  try { if (!S.collections) S.collections = (await api("/collections")).items; }
  catch (err) { return fail(err); }
  const q = S.query.toLowerCase();
  const items = S.collections.filter((c) => !q || c.title.toLowerCase().includes(q));
  const sorters = {
    taken: (a, b) => (b.taken + b.rules) - (a.taken + a.rules) || b.monochrome_pairs - a.monochrome_pairs || a.title.localeCompare(b.title),
    pairs: (a, b) => b.monochrome_pairs - a.monochrome_pairs || a.title.localeCompare(b.title),
    mono: (a, b) => (b.monochrome_share ?? -1) - (a.monochrome_share ?? -1) || b.monochrome_pairs - a.monochrome_pairs,
    floor: (a, b) => (a.floor ?? 1e12) - (b.floor ?? 1e12),
    name: (a, b) => a.title.localeCompare(b.title),
  };
  items.sort(sorters[S.sort]);
  const noWiki = !S.collections.some((c) => c.monochrome_pairs);
  const total = S.collections.reduce((s, c) => s + c.taken, 0);
  view.innerHTML = readiness() + `
    <div class="controls">
      <input id="q" placeholder="поиск коллекции" value="${esc(S.query)}">
      <select id="sort">
        <option value="taken">сначала, что берёт бот</option><option value="pairs">по числу монохромов</option>
        <option value="mono">по доле монохромов</option><option value="floor">по флору ↑</option><option value="name">по названию</option>
      </select>
    </div>
    <div class="muted" style="margin:0 2px 10px">Бот берёт: <b>${total}</b> пар · коллекций: ${items.length}</div>
    ${noWiki ? '<div class="card muted">Нет данных Gift Wiki: монохромные пары не показываются. Проверьте GIFTWIKI_API_KEY. Правило «любой фон» работает и без них.</div>' : ""}
    ${items.map((c) => `
      <div class="gcard tap ${c.taken ? "taken" : ""}" data-col="${esc(c.name)}">
        <div class="gimg"><span class="initial">${esc(c.title[0] || "?")}</span>${pic(c.image)}</div>
        <div class="gbody"><div class="title">${esc(c.title)}</div>
          <div class="muted">${c.monochrome_pairs} пар · бот берёт ${c.taken} · флор ${ton(c.floor)}</div>
          <div class="badges">
            ${c.monochrome_share != null ? `<span class="badge mono">⚫ моделей ${c.monochrome_models} из ${c.known_models} — ${pct(c.monochrome_share)}</span>` : ""}
            ${c.rules ? `<span class="badge">ещё правил: ${c.rules}</span>` : ""}
          </div></div>
      </div>`).join("") || '<div class="empty">Ничего не найдено. Список коллекций обновляется из MRKT раз в час.</div>'}`;
  const sort = document.getElementById("sort"); sort.value = S.sort;
  sort.onchange = () => { S.sort = sort.value; renderCollections(); };
  const input = document.getElementById("q");
  input.oninput = () => { S.query = input.value; clearTimeout(input.t); input.t = setTimeout(() => {
    renderCollections(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  view.querySelectorAll("[data-col]").forEach((el) => el.onclick = () => { haptic(); openCollection(el.dataset.col); });
}

async function openCollection(name) {
  S.tab = "collections"; S.page = "collection";
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === "collections"));
  setBack(); spinner(); window.scrollTo(0, 0);
  try { S.col = await api("/collections/" + encodeURIComponent(name)); } catch (err) { return fail(err); }
  drawCollection();
}
let modelQuery = "";
let modelFilter = "all";
function drawCollection() {
  const c = S.col;
  const q = modelQuery.toLowerCase();
  const models = c.models.filter((m) => (!q || m.name.toLowerCase().includes(q))
    && (modelFilter === "all" || (modelFilter === "mono" ? m.pairs.length : m.taken)));
  view.innerHTML = `
    <div class="crumbs"><a data-nav="list">Коллекции</a> › ${esc(c.title)}</div>
    <div class="card">
      <div class="row"><div class="grow"><div class="title">${esc(c.title)}</div>
        <div class="muted">бот берёт ${c.taken} · флор ${ton(c.floor)}</div></div>
        <label class="switch" title="покупать автоматически"><input type="checkbox" id="autobuy" ${c.autobuy ? "checked" : ""} ${S.me && S.me.can_purchase ? "" : "disabled"}><span></span></label></div>
      <div class="muted" style="margin-top:4px">${c.autobuy ? "🛒 покупать автоматически" : "🔔 только уведомлять"} — для всего, что выбрано в коллекции</div>
      <div class="stat">
        <div><b>${c.monochrome_pairs}</b><span>монохромных пар</span></div>
        <div><b>${c.monochrome_share != null ? pct(c.monochrome_share) : "—"}</b><span>монохромных моделей</span></div>
        <div><b>${ton(c.floor)}</b><span>флор</span></div>
      </div>
      ${c.giftwiki ? "" : '<div class="muted">Gift Wiki не знает монохромов этой коллекции (или нет данных).</div>'}
    </div>
    <div class="card">
      <b>Вся коллекция</b>
      ${optionRow("w-any", "Любой подарок коллекции", c.whole.any)}
      ${optionRow("w-mono", "Любой монохром коллекции", c.whole.monochrome)}
      <button class="btn ghost" id="savewhole">Сохранить для всей коллекции</button>
    </div>
    <input id="mq" placeholder="поиск модели" value="${esc(modelQuery)}">
    <div class="chips">
      ${[["all", "Все"], ["mono", "С монохромом"], ["taken", "Бот берёт"]].map(([k, t]) => `<button class="chip ${modelFilter === k ? "on" : ""}" data-mf="${k}">${t}</button>`).join("")}
    </div>
    ${models.map((m) => { const p = m.pairs.find((x) => x.center) || {}; return `
      <div class="gcard tap ${m.taken ? "taken" : ""}" data-model="${esc(m.name)}">
        <div class="gimg"${backdrop(p.center, p.edge)}><span class="initial">${esc(m.name[0] || "?")}</span>${pic(m.image, c.image)}</div>
        <div class="gbody"><div class="title">${esc(m.name)}</div>
          <div class="muted">${m.pairs.length ? `${m.pairs.length} монохромных фон(ов)` : "нет монохромов"} · бот берёт ${m.taken} · редк. ${pct(m.rarity)}${
            m.floor != null ? ` · флор ${ton(m.floor)}` : m.seen_floor != null ? ` · от ${ton(m.seen_floor)}` : ""}</div>
          <div class="badges">
            ${m.monochrome_chance != null ? `<span class="badge mono">шанс монохрома ${pct(m.monochrome_chance)}</span>` : ""}
            ${m.any != null ? `<span class="badge rule">любой фон ≤ ${ton(m.any)}</span>` : ""}
            ${m.monochrome != null ? `<span class="badge rule">все монохромы ≤ ${ton(m.monochrome)}</span>` : ""}
          </div></div>
      </div>`; }).join("") || '<div class="empty">Моделей не найдено. Бот запоминает модели, которые видит на MRKT.</div>'}`;
  const mq = document.getElementById("mq");
  mq.oninput = () => { modelQuery = mq.value; clearTimeout(mq.t); mq.t = setTimeout(() => {
    drawCollection(); const n = document.getElementById("mq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  view.querySelectorAll("[data-mf]").forEach((b) => b.onclick = () => { modelFilter = b.dataset.mf; haptic(); drawCollection(); });
  view.querySelectorAll("[data-model]").forEach((el) => el.onclick = () => { haptic(); openModel(el.dataset.model); });
  document.getElementById("autobuy").onchange = (e) => setAutobuy(e.target.checked);
  document.getElementById("savewhole").onclick = (e) => savePicks(e.target, () => ({
    model: null, any_price_ton: optionValue("w-any"), monochrome_price_ton: optionValue("w-mono"), pairs: [] }));
}
function optionRow(id, label, price) {
  return `<div class="opt"><input type="checkbox" class="box" id="${id}-on" ${price != null ? "checked" : ""}>
    <label class="grow" for="${id}-on">${esc(label)}</label>
    <input class="price" id="${id}-price" inputmode="decimal" placeholder="до, TON" value="${price != null ? esc(price) : ""}"></div>`;
}
function optionValue(id) {
  const on = document.getElementById(id + "-on").checked;
  const price = document.getElementById(id + "-price").value.trim();
  if (on && !price) throw new Error("Укажите цену");
  return on ? price : null;
}
async function setAutobuy(value) {
  haptic();
  try {
    if (S.col.plans.length) for (const id of S.col.plans) await api(`/rules/${id}`, "PATCH", { autobuy: value });
    S.col.autobuy = value; toast(value ? "Будет покупать автоматически" : "Будет только уведомлять");
    await loadMe(); drawCollection();
  } catch (err) { toast(err.message); drawCollection(); }
}
async function savePicks(button, body) {
  try { body = typeof body === "function" ? body() : body; } catch (err) { return toast(err.message); }
  button.disabled = true;
  try {
    S.col = await api(`/collections/${encodeURIComponent(S.col.name)}/picks`, "PUT", { ...body, autobuy: S.col.autobuy });
    S.collections = null; await loadMe();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    toast("Сохранено");
    S.page === "model" ? drawModel(body.model) : drawCollection();
  } catch (err) { button.disabled = false; toast(err.message); }
}

// ------------------------------------------------------------------ model: monochrome pairs with own prices
function openModel(name) { S.page = "model"; setBack(); window.scrollTo(0, 0); drawModel(name); }
function drawModel(name) {
  const c = S.col;
  const m = c.models.find((x) => x.name === name);
  if (!m) { S.page = "collection"; return drawCollection(); }
  view.innerHTML = `
    <div class="crumbs"><a data-nav="list">Коллекции</a> › <a data-nav="collection">${esc(c.title)}</a> › ${esc(m.name)}</div>
    <div class="card">
      <div class="title">${esc(m.name)}</div>
      <div class="muted">редкость ${pct(m.rarity)}${m.floor != null ? ` · флор модели ${ton(m.floor)}` : m.seen_floor != null ? ` · в продаже от ${ton(m.seen_floor)}` : ""}${
        m.monochrome_chance != null ? ` · шанс монохрома ${pct(m.monochrome_chance)}` : ""}</div>
      ${optionRow("m-any", "Любой фон", m.any)}
      ${optionRow("m-mono", "Все монохромные фоны", m.monochrome)}
      <div class="muted">Цена у отдельной пары ниже важнее цены «все монохромные фоны».</div>
    </div>
    <h3>Монохромные пары · Gift Wiki (${m.pairs.length})</h3>
    ${m.pairs.map((p, i) => `
      <div class="gcard ${p.price != null ? "taken" : ""}" id="pair-${i}">
        <div class="gimg tall"${backdrop(p.center, p.edge)}><span class="initial">${esc(m.name[0] || "?")}</span>${pic(p.image, c.image)}
          <span class="corner">${level(p.type)}</span></div>
        <div class="gbody"><div class="title">${esc(p.backdrop)}</div>
          <div class="muted">${esc(m.name)} · ${esc(c.title)}</div>
          <div class="badges"><span class="badge">фон ${pct(p.rarity)}</span><span class="badge mono">монохром: ${esc(p.type || "?")}</span>
            <span class="badge ${p.price != null ? "rule" : ""}" id="state-${i}">${p.price != null ? "бот берёт" : "бот не берёт"}</span></div>
          <div class="opt" style="border:0"><input type="checkbox" class="box" data-pair="${i}" id="p-${i}" ${p.price != null ? "checked" : ""}>
            <label class="grow" for="p-${i}">Брать эту пару</label>
            <input class="price" data-price="${i}" inputmode="decimal" placeholder="вход до, TON" value="${p.price != null ? esc(p.price) : ""}"></div>
        </div>
      </div>`).join("") || `<div class="card muted">${c.giftwiki ? "Gift Wiki не знает монохромных фонов для этой модели." : "Нет данных Gift Wiki — монохромные пары не определяются."}</div>`}
    <div class="savebar"><button class="btn" id="savemodel">Сохранить</button></div>`;
  view.querySelectorAll("[data-pair]").forEach((box) => box.onchange = () => {
    haptic();
    const i = box.dataset.pair;
    const price = view.querySelector(`[data-price="${i}"]`);
    if (box.checked && !price.value) price.value = document.getElementById("m-mono-price").value || (m.floor ?? "");
    document.getElementById("pair-" + i).classList.toggle("taken", box.checked);
    const state = document.getElementById("state-" + i);
    state.textContent = box.checked ? "бот берёт" : "бот не берёт"; state.classList.toggle("rule", box.checked);
  });
  view.querySelectorAll("[data-price]").forEach((input) => input.oninput = () => {
    const box = view.querySelector(`[data-pair="${input.dataset.price}"]`);
    if (input.value.trim() && !box.checked) { box.checked = true; box.onchange(); }
  });
  document.getElementById("savemodel").onclick = (e) => savePicks(e.target, () => ({
    model: m.name,
    any_price_ton: optionValue("m-any"),
    monochrome_price_ton: optionValue("m-mono"),
    pairs: m.pairs.map((p, i) => ({ p, i })).filter(({ i }) => view.querySelector(`[data-pair="${i}"]`).checked)
      .map(({ p, i }) => {
        const price = view.querySelector(`[data-price="${i}"]`).value.trim();
        if (!price) throw new Error(`Укажите цену для фона ${p.backdrop}`);
        return { backdrop: p.backdrop, price_ton: price };
      }),
  }));
}

// ------------------------------------------------------------------ what the bot takes
async function renderRules() {
  spinner();
  let rules;
  try { rules = (await api("/rules")).items; } catch (err) { return fail(err); }
  const total = rules.filter((r) => r.plan && r.enabled).reduce((s, r) => s + r.picks.length, 0);
  view.innerHTML = readiness() + `<div class="muted" style="margin:0 2px 10px">Бот берёт: <b>${total}</b> пар и моделей</div>` + (rules.length ? rules.map((r) => `
    <div class="card">
      <div class="row"><div class="grow"><div style="font-weight:700">${esc(r.name)}</div>
        <div class="muted">${r.plan ? `${r.picks.length} выбрано` : esc(r.summary.join(" · ") || "без условий")}</div></div>
        <label class="switch" title="включено"><input type="checkbox" data-en="${r.id}" ${r.enabled ? "checked" : ""}><span></span></label></div>
      ${r.plan ? `<div class="badges">${r.picks.slice(0, 8).map((p) => `<span class="badge">${esc(p)}</span>`).join("")}${r.picks.length > 8 ? `<span class="badge">и ещё ${r.picks.length - 8}</span>` : ""}</div>` : ""}
      <div class="muted" style="margin-top:8px">${!r.enabled ? "⏸ выключено" : r.autobuy ? "🛒 покупает автоматически" : "🔔 только уведомления"}</div>
      <div class="chips">
        ${S.me && S.me.can_purchase ? `<button class="chip" data-ab="${r.id}" data-v="${r.autobuy ? 0 : 1}">${r.autobuy ? "Только уведомлять" : "Покупать автоматически"}</button>` : ""}
        ${r.collection ? `<button class="chip" data-open="${esc(r.collection)}">Открыть коллекцию</button>` : ""}
        <button class="chip" data-del="${r.id}">Удалить</button>
      </div>
    </div>`).join("") : '<div class="empty">Пока ничего не выбрано.<br>Откройте «Коллекции», выберите коллекцию, модель и пары.</div>');
  view.querySelectorAll("[data-en]").forEach((el) => el.onchange = () => patchRule(el.dataset.en, { enabled: el.checked }));
  view.querySelectorAll("[data-ab]").forEach((el) => el.onclick = () => patchRule(el.dataset.ab, { autobuy: el.dataset.v === "1" }));
  view.querySelectorAll("[data-open]").forEach((el) => el.onclick = () => openCollection(el.dataset.open));
  view.querySelectorAll("[data-del]").forEach((el) => el.onclick = async () => {
    if (!(await confirmBox("Удалить это правило?"))) return;
    try { await api(`/rules/${el.dataset.del}`, "DELETE"); S.collections = null; await loadMe(); toast("Удалено"); } catch (err) { toast(err.message); }
    renderRules();
  });
}
async function patchRule(id, body) {
  haptic();
  try { await api(`/rules/${id}`, "PATCH", body); S.collections = null; await loadMe(); }
  catch (err) { toast(err.message); }
  renderRules();
}

// ------------------------------------------------------------------ limits
async function renderSettings() {
  spinner();
  try { await loadMe(); } catch (err) { return fail(err); }
  const m = S.me, l = m.limits;
  const modeText = { live: "💸 live — реальные покупки", dry_run: "🧪 тестовый — покупки только имитируются", notify_only: "🔔 только уведомления" }[m.run_mode] || m.run_mode;
  view.innerHTML = readiness() + `
    <div class="card"><b>Общие лимиты</b> <span class="muted">— обязательны для покупок, действуют на всё</span>
      <div class="field"><label>На одну покупку, TON</label><input id="pp" inputmode="decimal" value="${esc(l.per_purchase ?? "")}" placeholder="не задан"></div>
      <div class="field"><label>На день, TON (потрачено сегодня ${ton(m.spent.today)})</label><input id="dl" inputmode="decimal" value="${esc(l.daily ?? "")}" placeholder="не задан"></div>
      <div class="field"><label>Всего, TON (потрачено ${ton(m.spent.total)})</label><input id="tt" inputmode="decimal" value="${esc(l.total ?? "")}" placeholder="не задан"></div>
      <button class="btn" id="savelim">Сохранить лимиты</button>
    </div>
    <div class="card">
      ${[["autobuy_enabled", "Автопокупка подарков", "«любой фон» и обычные правила"],
         ["monochrome_autobuy_enabled", "Автопокупка монохромов", "монохромные пары и «все монохромы»"],
         ["purchases_paused", "Пауза покупок", "временно ничего не покупать"]].map(([k, t, d]) => `
        <div class="row field"><div class="grow"><b>${t}</b><div class="muted">${d}</div></div>
          <label class="switch"><input type="checkbox" data-pref="${k}" ${m[k] ? "checked" : ""}><span></span></label></div>`).join("")}
    </div>
    <div class="card"><b>Режим работы</b><div class="muted" style="margin-top:4px">${esc(modeText)}.
      ${m.run_mode !== "live" ? " Чтобы покупать по-настоящему, поменяйте RUN_MODE=live в файле .env и перезапустите бота (docker compose up -d)." : ""}</div>
      <div class="muted" style="margin-top:6px">Gift Wiki: ${m.giftwiki.records ? `${m.giftwiki.records} монохромных записей` : "нет данных"}</div>
      ${m.stopped
        ? (m.is_admin ? '<button class="btn" id="resume">Снять аварийную остановку</button>' : '<div class="muted">Аварийная остановка включена. Снять её может администратор.</div>')
        : '<button class="btn danger" id="stop">⛔ Аварийно остановить все покупки</button>'}
    </div>`;
  document.getElementById("savelim").onclick = async (e) => {
    e.target.disabled = true;
    const val = (id) => document.getElementById(id).value.trim() || null;
    try { await api("/settings", "PUT", { per_purchase_ton: val("pp"), daily_ton: val("dl"), total_ton: val("tt") }); toast("Лимиты сохранены"); renderSettings(); }
    catch (err) { e.target.disabled = false; toast(err.message); }
  };
  view.querySelectorAll("[data-pref]").forEach((el) => el.onchange = async () => {
    haptic();
    try { await api("/settings", "PUT", { [el.dataset.pref]: el.checked }); } catch (err) { toast(err.message); }
    renderSettings();
  });
  const stop = document.getElementById("stop");
  if (stop) stop.onclick = async () => { if (await confirmBox("Остановить все автопокупки?")) { try { await api("/stop", "POST"); toast("Покупки остановлены"); } catch (err) { toast(err.message); } renderSettings(); } };
  const resume = document.getElementById("resume");
  if (resume) resume.onclick = async () => { try { await api("/resume", "POST"); toast("Остановка снята"); } catch (err) { toast(err.message); } renderSettings(); };
}

// ------------------------------------------------------------------ history
async function renderHistory() {
  spinner();
  let items;
  try { items = (await api("/history")).items; } catch (err) { return fail(err); }
  view.innerHTML = items.length ? items.map((a) => `
    <div class="card"><div class="row"><div class="grow">
      <div style="font-weight:700">${a.url ? `<a href="${esc(a.url)}" data-tme>${esc(a.title)}</a>` : esc(a.title)}</div>
      <div class="muted">${new Date(a.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} · ${esc(a.model || "")}${a.backdrop ? " · " + esc(a.backdrop) : ""}</div></div>
      <div style="text-align:right"><b>${ton(a.price)}</b><div class="badges" style="justify-content:flex-end">
        <span class="badge ${a.status === "confirmed" ? "ok" : ""}">${esc(a.status_label)}</span></div></div></div></div>`).join("")
    : '<div class="empty">Покупок пока не было.</div>';
  view.querySelectorAll("[data-tme]").forEach((a) => a.onclick = (e) => {
    if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(a.href); }
  });
}

// ------------------------------------------------------------------ start
(async () => {
  if (!tg || !tg.initData) {
    view.innerHTML = '<div class="card"><b>Откройте приложение из Telegram</b><div class="muted">Кнопка «Снайпер» в чате с ботом или команда /app.</div></div>';
    return;
  }
  try { await loadMe(); } catch (err) { return fail(err); }
  showTab("collections");
})();
</script>
</body>
</html>
