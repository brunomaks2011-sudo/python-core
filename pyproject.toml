[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-sniper"
version = "1.0.0"
description = "Telegram Gift Sniper Bot: MRKT listings monitor and autobuyer with Gift Wiki monochrome classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp>=3.11,<4",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "redis==8.1.0",
    "pydantic>=2.11,<2.14",
    "pydantic-settings==2.16.1",
    "prometheus-client==0.26.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis[lua]==2.40.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[project.scripts]
gift-sniper = "gift_sniper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: tests that need PostgreSQL (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "RUF001", "RUF002", "RUF003",
    "PLC0415",
    "PLR0917",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
