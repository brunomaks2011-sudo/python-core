*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#0b0b0d;font-family:'LNU Display'}
.bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 70% 30%,rgba(227,0,11,.65),transparent 65%),linear-gradient(160deg,#1a1a1d,#0b0b0d)}
.studs{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(circle at 20px 20px,#fff 0 9px,transparent 10px);background-size:40px 40px}
.hero{position:absolute;right:-20px;top:40px;width:640px;height:640px;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.panel{position:absolute;right:30px;top:60px;width:560px;height:600px;border-radius:30px;background:#fff;box-shadow:0 0 0 8px #FFD500,0 30px 60px rgba(0,0,0,.6);transform:rotate(3deg)}
.figs{position:absolute;left:40px;bottom:30px;width:690px;height:230px;border-radius:22px;background:#fff;box-shadow:0 0 0 6px #E3000B;display:flex;align-items:center;justify-content:space-around;padding:8px 10px}.figs img{height:210px;width:108px;object-fit:contain}
.logo{position:absolute;left:40px;top:34px;padding:8px 20px;border-radius:14px;background:#E3000B;box-shadow:0 0 0 5px #FFD500;color:#fff;font-weight:900;font-size:40px}
.logo b{color:#FFD500}
.h1{position:absolute;left:40px;top:120px;width:700px;color:#fff;font-weight:900;font-size:92px;line-height:.98;text-shadow:0 6px 0 rgba(0,0,0,.45);-webkit-text-stroke:2px #000;paint-order:stroke fill}
.h1 span{color:#FFD500}
.leak{position:absolute;left:40px;top:392px;padding:8px 22px;border-radius:999px;background:#C2410C;color:#fff;font-weight:900;font-size:34px;letter-spacing:.08em}
