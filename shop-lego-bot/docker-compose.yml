# Повний стек для сервера: PostgreSQL + бот + щоденні резервні копії.
# Запуск:  docker compose up -d --build
# Логи:    docker compose logs -f bot
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lego_shop}
      POSTGRES_USER: ${POSTGRES_USER:-lego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у файлі .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    image: shop-lego-bot:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Для контейнера адреса бази — сервіс «db» (перекриває DATABASE_URL з .env)
      DATABASE_URL: postgresql://${POSTGRES_USER:-lego}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lego_shop}?schema=public
      HEALTH_PORT: "8080"
    # Для режиму webhook відкрийте порт (WEBHOOK_PORT) і налаштуйте reverse proxy з HTTPS:
    # ports:
    #   - "127.0.0.1:8443:8443"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-lego_shop}
      PGUSER: ${POSTGRES_USER:-lego}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    # tr прибирає Windows-переноси рядків (CRLF), якщо проєкт клонували у Windows
    entrypoint: ["sh", "-c", "tr -d '\\r' < /usr/local/bin/backup-loop.sh > /tmp/backup-loop.sh && exec sh /tmp/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
