services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sniper}
      POSTGRES_USER: ${POSTGRES_USER:-sniper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence keeps queues and the emergency-stop flag across restarts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sniper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sniper}
      REDIS_URL: redis://redis:6379/0
      WEBAPP_TUNNEL_METRICS_URL: http://tunnel:2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Telegram session created by `mrkt-login` (full access to the Telegram account: keep it private)
      - botdata:/app/data
    ports:
      - "127.0.0.1:9100:9100"  # /metrics and /health, local only
    restart: unless-stopped

  tunnel:
    # Public HTTPS address for the Telegram Mini App: a free Cloudflare quick tunnel (no account needed)
    # to the bot's Mini App server. The address changes after every restart; the bot reads it from the
    # tunnel's metrics endpoint and updates its menu button. Only the Mini App port is exposed: its API
    # answers only requests signed by Telegram for users allowed in the bot.
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://bot:8080
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  botdata:
