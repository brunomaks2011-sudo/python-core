*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0d;font-family:'D'}
.bg{position:absolute;inset:0;background:radial-gradient(900px 900px at 70% 35%,rgba(227,0,11,.7),transparent 62%),radial-gradient(700px 600px at 10% 95%,rgba(255,213,0,.2),transparent 60%),linear-gradient(170deg,#1b1b1f,#0b0b0d)}
.studs{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(circle at 40px 40px,#fff 0 17px,transparent 18px);background-size:80px 80px}
.logo{position:absolute;left:0;right:0;top:200px;text-align:center}.logo span{display:inline-block;padding:10px 30px;border-radius:18px;background:#E3000B;box-shadow:0 0 0 6px #FFD500;color:#fff;font-weight:900;font-size:56px}.logo b{color:#FFD500}
.h{position:absolute;left:40px;right:40px;top:330px;text-align:center;color:#fff;font-weight:900;font-size:136px;line-height:.92;text-transform:uppercase;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.5)}.h b{color:#FFD500}
.hero{position:absolute;left:70px;top:640px;width:940px;height:600px;border-radius:36px;background:#fff;box-shadow:0 0 0 10px #FFD500,0 40px 80px rgba(0,0,0,.6);transform:rotate(-2deg);overflow:hidden}.hero img{width:100%;height:100%;object-fit:contain}
.figs{position:absolute;left:50px;top:1250px;width:980px;height:330px;border-radius:30px;background:#fff;box-shadow:0 0 0 8px #E3000B;display:flex;justify-content:space-around;align-items:center;padding:0 10px;transform:rotate(1.5deg)}.figs img{width:150px;height:300px;object-fit:contain}
.six{position:absolute;left:0;right:0;top:1180px;text-align:center}.six span{display:inline-block;padding:10px 30px;border-radius:20px;background:#E3000B;color:#fff;font-weight:900;font-size:64px;box-shadow:0 0 0 6px #FFD500;transform:rotate(-4deg)}
.leak{position:absolute;right:60px;top:610px;padding:10px 26px;border-radius:999px;background:#C2410C;color:#fff;font-weight:900;font-size:44px;letter-spacing:.08em;transform:rotate(6deg)}
</style></head><body><div class="bg"></div><div class="studs"></div>
